<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTA 機台預約系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: single working column; step rail on top, form card below, report renders as two A4-like "copies" */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d8dee5;
  --accent:#0a7fa8; --accent-soft:#e2f2f8; --ok:#1e7d4f; --warn:#a4600a; --busy:#e9ecef; --busy-ink:#98a2ad;
  --paper:#ffffff; --paper-ink:#111;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --ink:#e4e9ee; --muted:#9aa7b4; --line:#2c3743;
  --accent:#4cc1e8; --accent-soft:#16323e; --ok:#5fcf98; --warn:#e6a54a; --busy:#222b35; --busy-ink:#5f6b77;
  --paper:#f7f7f5; --paper-ink:#111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --ink:#e4e9ee; --muted:#9aa7b4; --line:#2c3743;
  --accent:#4cc1e8; --accent-soft:#16323e; --ok:#5fcf98; --warn:#e6a54a; --busy:#222b35; --busy-ink:#5f6b77;
  --paper:#f7f7f5; --paper-ink:#111; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rates{display:flex;flex-wrap:wrap;gap:6px}
.rate-chip{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--surface);color:var(--muted)}
.rate-chip b{color:var(--ink);font-weight:500}

/* step rail */
ol.rail{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
ol.rail li{border-top:3px solid var(--line);padding-top:8px;font-size:.82rem;color:var(--muted);cursor:pointer}
ol.rail li .n{font-family:var(--f-mono);font-size:.7rem;display:block}
ol.rail li.done{border-color:var(--ok);color:var(--ink)}
ol.rail li.cur{border-color:var(--accent);color:var(--ink);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
.card h2{font-size:1.15rem;margin:0 0 4px}
.card .hint{color:var(--muted);font-size:.85rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.f span.req::after{content:" *";color:var(--warn)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:120px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.invalid{border-color:var(--warn)!important}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{position:relative;display:block;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;background:var(--bg)}
.opt input{position:absolute;opacity:0}
.opt b{display:block;font-size:1rem}
.opt small{color:var(--muted);font-size:.82rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:700}

.pricebar{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;margin-top:18px;padding:12px 14px;border:1px dashed var(--accent);border-radius:6px;background:var(--accent-soft);font-size:.9rem}
.pricebar .big{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* slot picker */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 8px}
.cal-scroll{overflow-x:auto}
table.cal{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;font-size:.78rem}
table.cal th{font-weight:500;color:var(--muted);padding:2px}
table.cal th.time{font-family:var(--f-mono);text-align:right;padding-right:6px;width:48px}
table.cal td{padding:0}
.slot{width:100%;height:30px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;font-size:.7rem;color:var(--muted)}
.slot:hover{border-color:var(--accent)}
.slot.busy{background:var(--busy);color:var(--busy-ink);cursor:not-allowed;border-color:transparent}
.slot.sel{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}

table.rec{width:100%;border-collapse:collapse;font-size:.88rem}
table.rec th,table.rec td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
table.rec th{color:var(--muted);font-weight:500;font-size:.78rem}
table.rec input{padding:6px 8px;font-size:.88rem}
.rec-scroll{overflow-x:auto}
.rec-scroll table{min-width:560px}

.btns{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px}
button.b{font:inherit;font-size:.92rem;border-radius:6px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
button.b.ghost{border-color:transparent;color:var(--muted);padding-inline:8px}
.err{color:var(--warn);font-size:.85rem;margin-top:10px}
.example-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.8rem;color:var(--warn);margin-bottom:14px}

/* report (paper, always light) */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:28px 30px;margin-bottom:22px;font-size:13px;line-height:1.55}
.paper h3{font-family:var(--f-display);font-size:1.25rem;text-align:center;margin:0}
.paper .copy{text-align:center;font-size:.8rem;letter-spacing:.2em;margin:2px 0 14px}
.paper .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-family:var(--f-mono);font-size:11.5px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:12px}
.paper h4{font-size:.9rem;margin:14px 0 6px;border-left:3px solid #111;padding-left:6px}
.ptable{width:100%;border-collapse:collapse}
.ptable th,.ptable td{border:1px solid #888;padding:4px 7px;vertical-align:top;text-align:left}
.ptable th{background:#efefef;width:22%;font-weight:500;white-space:nowrap}
.ptable-scroll{overflow-x:auto}
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.sig{border:1px solid #888;height:76px;padding:4px 8px;font-size:11.5px;display:flex;flex-direction:column;justify-content:space-between}
.sig .d{color:#555}
.affidavit{margin-top:20px;border-top:1.5px dashed #555;padding-top:14px}
.affidavit.na{opacity:.45}
.affidavit h3{font-size:1.1rem}
.affidavit ol{margin:8px 0;padding-left:1.6em}
.cut{text-align:center;font-size:11px;color:#666;letter-spacing:.3em;margin:-10px 0 12px}
@media (max-width:620px){
  .grid{grid-template-columns:1fr}
  ol.rail li .t{display:none}
  .sigs{grid-template-columns:1fr}
  .paper{padding:18px 14px}
}
@media print{
  body{background:#fff}
  .wrap>header,.rail,.btns,.no-print{display:none!important}
  .card{border:0;padding:0}
  .paper{border:0;margin:0;page-break-after:always}
}
@media (prefers-reduced-motion:no-preference){.slot{transition:background .12s}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="tag">Nanoparticle Tracking Analysis</div>
      <h1>NTA 機台預約系統</h1>
      <p class="sub">四步驟完成申請，最後產生一式兩聯的預約報表</p>
    </div>
    <div class="rates" id="rateChips"></div>
  </header>

  <ol class="rail" id="rail">
    <li data-s="1"><span class="n">STEP 1</span><span class="t">申請人資料</span></li>
    <li data-s="2"><span class="n">STEP 2</span><span class="t">服務類型</span></li>
    <li data-s="3"><span class="n">STEP 3</span><span class="t">預約內容</span></li>
    <li data-s="4"><span class="n">STEP 4</span><span class="t">預約報表</span></li>
  </ol>

  <main class="card" id="stage"></main>
</div>

<script>
/* ========= 設定區：部署時只要改這裡 ========= */
const CONFIG = {
  unit: "國立清華大學 NTA 機台管理單位",           // 報表抬頭
  instrument: "奈米粒子追蹤分析儀 (NTA)",
  rates: {                                        // NT$/hr（範例費率，請依實際公告修改）
    consult: 0,       // 預約諮詢
    service: 1200,    // 委託代工
    training: 800,    // 機台訓練（每次 1 小時）
    exam: 800,        // 機台考核
    self: 600         // 自行操作
  },
  hours: [9,10,11,13,14,15,16],                   // 可預約起始時段（避開午休 12:00）
  maxSelfHours: 4,                                // 自行操作單次最多時數
  departments: ["動力機械工程學系","奈米工程與微系統研究所","化學工程學系","材料科學工程學系","醫學科學系","生命科學系","分析與環境科學研究所","其他（請於備註說明）"]
};
/* ========================================== */

const RATE_LABEL = {consult:"預約諮詢",service:"委託代工",training:"機台訓練",exam:"機台考核",self:"自行操作"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "NT$ " + Number(n||0).toLocaleString("zh-TW");

/* 範例資料，讓模板開啟時就看得到流程 */
const S = {
  step: 1,
  isExample: true,
  applicant: {name:"王小明", sid:"112033501", dept:"奈米工程與微系統研究所", advisor:"陳大文 教授", email:"xiaoming@gapp.nthu.edu.tw", phone:"0912-345-678", account:"NSTC 114-2221-E-007-000", note:""},
  mode: "self",                 // service | self
  sub: {service:"consult", self:"use"},
  consult: {topic:"外泌體 (exosome) 粒徑分佈與濃度量測", detail:"樣品為細胞培養上清液經超高速離心純化之外泌體，預計 6 件，溶於 PBS。想確認是否需要先稀釋、建議的濃度範圍，以及每件建議量測幾次。", prefer:""},
  order: {ref:"", count:6, type:"", size:"", solvent:"", repeat:3, hours:2, date:"", note:""},
  training: {round:"1"},
  exam: {records:[{trainee:"",trainer:"",date:"",hours:"1"},{trainee:"",trainer:"",date:"",hours:"1"},{trainee:"",trainer:"",date:"",hours:"1"}]},
  self: {purpose:"奈米金粒子粒徑分佈量測", samples:4},
  slots: {training:[], exam:[], use:[]},   // ["YYYY-MM-DD|H", ...]
  weekOffset: 0,
  appNo: ""
};

/* ----- 日期工具 ----- */
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const WD = ["一","二","三","四","五"];
function weekDays(){const m=mondayOf(new Date());m.setDate(m.getDate()+7*(S.weekOffset+1));return [0,1,2,3,4].map(i=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}
/* 已被預約時段：示範用的假資料（部署後改由資料庫提供） */
function isBusy(key){let h=0;for(const c of key)h=(h*31+c.charCodeAt(0))>>>0;return h%5===0}

/* ----- 計價 ----- */
function currentKind(){
  if(S.mode==="service") return S.sub.service==="consult"?"consult":"service";
  return {training:"training",exam:"exam",use:"self"}[S.sub.self];
}
function billHours(){
  const k=currentKind();
  if(k==="consult") return 0;
  if(k==="service") return Number(S.order.hours)||0;
  return S.slots[S.sub.self].length;
}
function priceBar(){
  const k=currentKind(), r=CONFIG.rates[k], h=billHours();
  return `<div class="pricebar"><span>計價方式：<b class="mono">${money(r)} / hr</b>（${RATE_LABEL[k]}）</span>
    <span>計費時數：<b class="mono">${h} hr</b></span>
    <span>預估費用：<span class="big">${money(r*h)}</span></span></div>`;
}

/* ----- 渲染 ----- */
function render(){
  document.querySelectorAll("#rail li").forEach(li=>{const n=+li.dataset.s;li.className=n<S.step?"done":n===S.step?"cur":""});
  $("#stage").innerHTML = [null,step1,step2,step3,step4][S.step]();
  bind();
}
function exampleNote(){return S.isExample?`<div class="example-note no-print">以下為範例資料，方便預覽流程。<button class="b ghost" data-act="clear">清除範例資料</button></div>`:""}

function field(id,label,val,{type="text",req=false,full=false,ph=""}={}){
  return `<label class="f${full?" full":""}"><span class="${req?"req":""}">${label}</span><input id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}"></label>`;
}
function step1(){
  const a=S.applicant;
  return `${exampleNote()}<h2>申請人資料</h2><p class="hint">標 * 為必填。經費來源用於後續請款。</p>
  <div class="grid">
    ${field("a_name","申請人姓名",a.name,{req:true})}
    ${field("a_sid","學號 / 員工編號",a.sid,{req:true})}
    <label class="f"><span class="req">所屬系所</span><select id="a_dept">${CONFIG.departments.map(d=>`<option${d===a.dept?" selected":""}>${esc(d)}</option>`).join("")}</select></label>
    ${field("a_advisor","指導教授",a.advisor,{req:true})}
    ${field("a_email","Email",a.email,{type:"email",req:true})}
    ${field("a_phone","聯絡電話",a.phone,{type:"tel"})}
    ${field("a_account","計畫編號 / 經費來源",a.account,{full:true,ph:"例：NSTC 114-XXXX-E-007-XXX"})}
    <label class="f full"><span>備註</span><textarea id="a_note" style="min-height:70px">${esc(a.note)}</textarea></label>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="btns"><span></span><button class="b primary" data-act="next">下一步：服務類型</button></div>`;
}
function step2(){
  return `<h2>服務類型</h2><p class="hint">尚未通過機台考核者，請選擇「委託代工」或先預約機台訓練。</p>
  <div class="opts">
    <label class="opt"><input type="radio" name="mode" value="service"${S.mode==="service"?" checked":""}><b>委託代工</b><small>由機台管理人員代為量測。需先預約諮詢，確認實驗方案後再下單。</small></label>
    <label class="opt"><input type="radio" name="mode" value="self"${S.mode==="self"?" checked":""}><b>自行操作</b><small>需完成 3 次機台訓練並通過考核後，方可預約使用時段。</small></label>
  </div>
  <div class="btns"><button class="b" data-act="prev">上一步</button><button class="b primary" data-act="next">下一步：預約內容</button></div>`;
}

function tabs(group,items){
  return `<div class="tabs" role="tablist">${items.map(([k,l])=>`<button role="tab" data-tab="${group}:${k}" aria-selected="${S.sub[group]===k}">${l}</button>`).join("")}</div>`;
}
function slotPicker(kind,maxSel,label){
  const days=weekDays(), sel=S.slots[kind];
  const head=`<tr><th class="time"></th>${days.map((d,i)=>`<th>週${WD[i]}<br><span class="mono">${d.getMonth()+1}/${d.getDate()}</span></th>`).join("")}</tr>`;
  const rows=CONFIG.hours.map(h=>`<tr><th class="time">${String(h).padStart(2,"0")}:00</th>${days.map(d=>{
    const key=ymd(d)+"|"+h, busy=isBusy(key), on=sel.includes(key);
    return `<td><button class="slot${busy?" busy":""}${on?" sel":""}" data-slot="${kind}|${key}" ${busy?"disabled aria-label='已預約'":""}>${busy?"已預約":on?"✓":""}</button></td>`}).join("")}</tr>`).join("");
  const w=days[0], e=days[4];
  return `<div class="weeknav"><button class="b ghost" data-act="wprev" ${S.weekOffset<=0?"disabled":""}>‹ 上一週</button>
    <span class="mono">${ymd(w)} – ${ymd(e)}</span><button class="b ghost" data-act="wnext" ${S.weekOffset>=7?"disabled":""}>下一週 ›</button></div>
  <div class="cal-scroll"><table class="cal">${head}${rows}</table></div>
  <div class="legend"><span><i></i>可預約</span><span><i style="background:var(--accent);border-color:var(--accent)"></i>已選取</span><span><i style="background:var(--busy);border-color:transparent"></i>已被預約</span><span>${label}（最多 ${maxSel} 格）</span></div>
  ${sel.length?`<p class="mono" style="font-size:.82rem;margin:8px 0 0">已選：${sel.slice().sort().map(fmtSlot).join("、")}</p>`:""}`;
}
function fmtSlot(k){const [d,h]=k.split("|");return `${d} ${String(h).padStart(2,"0")}:00–${String(+h+1).padStart(2,"0")}:00`}

function step3(){
  let body="";
  if(S.mode==="service"){
    body = tabs("service",[["consult","① 預約諮詢"],["order","② 已完成諮詢・下單"]]);
    if(S.sub.service==="consult"){
      const c=S.consult;
      body+=`<p class="hint">請先與機台管理人員討論實驗方案、樣品件數與可行性。管理人員會以 Email 回覆諮詢時間。</p>
      <div class="grid">
        ${field("c_topic","諮詢主題",c.topic,{req:true,full:true})}
        <label class="f full"><span class="req">實驗方案說明（樣品來源、種類、件數、溶劑、預期粒徑範圍、想解決的問題）</span><textarea id="c_detail" style="min-height:170px">${esc(c.detail)}</textarea></label>
        ${field("c_prefer","方便諮詢的時間",c.prefer,{full:true,ph:"例：週二、週四下午"})}
      </div>`;
    }else{
      const o=S.order;
      body+=`<p class="hint">僅限已完成預約諮詢之申請人。請填寫與管理人員確認過的實驗內容。</p>
      <div class="grid">
        ${field("o_ref","諮詢單號 / 諮詢日期",o.ref,{req:true,ph:"例：NTA-20261015-0123"})}
        ${field("o_count","樣品件數",o.count,{type:"number",req:true})}
        ${field("o_type","樣品種類",o.type,{req:true,ph:"例：外泌體、脂質奈米粒、奈米金"})}
        ${field("o_size","預期粒徑範圍 (nm)",o.size,{ph:"例：50–200"})}
        ${field("o_solvent","分散液 / 緩衝液",o.solvent,{ph:"例：PBS、去離子水"})}
        ${field("o_repeat","每件量測次數",o.repeat,{type:"number"})}
        ${field("o_hours","預估機台時數 (hr)",o.hours,{type:"number",req:true})}
        ${field("o_date","希望完成日期",o.date,{type:"date"})}
        <label class="f full"><span>實驗內容 / 特殊需求</span><textarea id="o_note" style="min-height:90px">${esc(o.note)}</textarea></label>
      </div>`;
    }
  }else{
    body = tabs("self",[["training","機台訓練"],["exam","機台考核"],["use","預約使用"]]);
    if(S.sub.self==="training"){
      body+=`<p class="hint">每次訓練 1 小時，共需完成 3 次訓練才能預約考核。請選一個時段。</p>
      <div class="grid" style="margin-bottom:12px"><label class="f"><span class="req">本次為第幾次訓練</span><select id="t_round">${["1","2","3"].map(r=>`<option value="${r}"${S.training.round===r?" selected":""}>第 ${r} 次</option>`).join("")}</select></label></div>
      ${slotPicker("training",1,"訓練 1 小時")}`;
    }else if(S.sub.self==="exam"){
      body+=`<p class="hint">預約考核前請填寫 3 次訓練紀錄，管理人員會與訓練簽到表核對。</p>
      <div class="rec-scroll"><table class="rec"><tr><th>#</th><th>受訓人</th><th>訓練人</th><th>受訓日期</th><th>受訓時數</th></tr>
      ${S.exam.records.map((r,i)=>`<tr><td class="mono">${i+1}</td>
        <td><input type="text" id="r${i}_trainee" value="${esc(r.trainee||S.applicant.name)}"></td>
        <td><input type="text" id="r${i}_trainer" value="${esc(r.trainer)}" placeholder="管理人員姓名"></td>
        <td><input type="date" id="r${i}_date" value="${esc(r.date)}"></td>
        <td><input type="number" id="r${i}_hours" value="${esc(r.hours)}" min="0" step="0.5" style="max-width:80px"></td></tr>`).join("")}
      </table></div>
      <h3 style="font-size:.95rem;margin:20px 0 4px">選擇考核時段</h3>
      ${slotPicker("exam",1,"考核 1 小時")}`;
    }else{
      body+=`<p class="hint">限已通過考核者。可選連續或分開的時段，單次最多 ${CONFIG.maxSelfHours} 小時。</p>
      <div class="grid" style="margin-bottom:12px">
        ${field("u_purpose","量測目的 / 樣品",S.self.purpose,{req:true})}
        ${field("u_samples","樣品件數",S.self.samples,{type:"number"})}
      </div>
      ${slotPicker("use",CONFIG.maxSelfHours,"自行操作")}`;
    }
  }
  return `<h2>預約內容 · ${S.mode==="service"?"委託代工":"自行操作"}</h2>${body}${priceBar()}
  <div class="err" id="err" hidden></div>
  <div class="btns"><button class="b" data-act="prev">上一步</button><button class="b primary" data-act="next">產生預約報表</button></div>`;
}

/* ----- 報表 ----- */
const H=h=>({h});
function detailRows(){
  const k=currentKind(), rows=[["服務類型",(S.mode==="service"?"委託代工":"自行操作")+" — "+RATE_LABEL[k]]];
  if(k==="consult"){rows.push(["諮詢主題",S.consult.topic],["實驗方案說明",S.consult.detail],["方便諮詢時間",S.consult.prefer||"—"])}
  if(k==="service"){const o=S.order;rows.push(["諮詢單號",o.ref],["樣品件數 / 種類",`${o.count} 件　${o.type}`],["預期粒徑 / 分散液",`${o.size||"—"} nm　${o.solvent||"—"}`],["每件量測次數",o.repeat],["希望完成日期",o.date||"—"],["實驗內容 / 特殊需求",o.note||"—"])}
  if(k==="training"){rows.push(["訓練次別",`第 ${S.training.round} 次（共 3 次）`],["預約時段",H(S.slots.training.map(fmtSlot).join("<br>"))])}
  if(k==="exam"){rows.push(["訓練紀錄",H(`<div class="ptable-scroll"><table class="ptable" style="font-size:12px"><tr><th style="width:auto">#</th><th style="width:auto">受訓人</th><th style="width:auto">訓練人</th><th style="width:auto">受訓日期</th><th style="width:auto">時數</th></tr>${S.exam.records.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.trainee)}</td><td>${esc(r.trainer)}</td><td>${esc(r.date)}</td><td>${esc(r.hours)}</td></tr>`).join("")}</table></div>`)],["考核時段",H(S.slots.exam.map(fmtSlot).join("<br>"))])}
  if(k==="self"){rows.push(["量測目的 / 樣品",`${S.self.purpose}（${S.self.samples} 件）`],["預約時段",H(S.slots.use.slice().sort().map(fmtSlot).join("<br>"))])}
  const r=CONFIG.rates[k], h=billHours();
  rows.push(["計價方式",`${money(r)} / hr`],["計費時數 / 預估費用",H(`${h} hr　／　<b>${money(r*h)}</b>`)]);
  return rows;
}
function copyHtml(label){
  const a=S.applicant;
  const t=(rows)=>`<div class="ptable-scroll"><table class="ptable">${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v&&v.h!==undefined?v.h:esc(v).replace(/\n/g,"<br>")}</td></tr>`).join("")}</table></div>`;
  const sigs=`<div class="sigs">${["申請人簽名","指導教授簽名","機台管理人員簽名"].map(s=>`<div class="sig"><span>${s}</span><span class="d">日期：　　年　　月　　日</span></div>`).join("")}</div>`;
  const selfOp=S.mode==="self";
  return `<section class="paper">
    <h3>${esc(CONFIG.instrument)} 預約申請單</h3>
    <div class="copy">【 ${label} 】</div>
    <div class="meta"><span>申請編號：${S.appNo}</span><span>申請日期：${ymd(new Date())}</span><span>${esc(CONFIG.unit)}</span></div>
    <h4>一、申請人基本資料</h4>
    ${t([["申請人姓名",a.name],["學號 / 員工編號",a.sid],["所屬系所",a.dept],["指導教授",a.advisor],["Email / 電話",`${a.email}　${a.phone||""}`],["計畫編號 / 經費來源",a.account||"—"],["備註",a.note||"—"]])}
    <h4>二、預約確認資料</h4>
    ${t(detailRows())}
    ${sigs}
    <div class="affidavit${selfOp?"":" na"}">
      <h3>機台使用切結書</h3>
      <p style="text-align:center;font-size:11.5px;margin:2px 0 8px">（限自行操作之人員填寫${selfOp?"":"；本次為委託代工，免填"}）</p>
      <p>立切結書人 <u>&nbsp;${esc(a.name)}&nbsp;</u>（以下稱申請人）向${esc(CONFIG.unit)}申請自行操作${esc(CONFIG.instrument)}，茲聲明並同意遵守下列事項：</p>
      <ol>
        <li>申請人已接受機台操作訓練，並將依標準作業程序（SOP）及管理人員指示操作，不擅自變更儀器設定、拆卸零組件，或使用未經核准之樣品與溶劑。</li>
        <li>使用期間如發生異常狀況，應立即停止操作並通知機台管理人員，不得自行排除故障。</li>
        <li>於自行操作期間，因操作不當、違反使用規範或其他可歸責於申請人之事由，致設備損壞或故障者，申請人應負照價賠償及維修費用之責任；指導教授負督導之責。</li>
        <li>違反上述規定者，管理單位得暫停或取消其機台使用資格。</li>
      </ol>
      <p>此致　${esc(CONFIG.unit)}</p>
      ${sigs}
    </div>
  </section>`;
}
function step4(){
  if(!S.appNo) S.appNo="NTA-"+ymd(new Date()).replace(/-/g,"")+"-"+String(Math.floor(Math.random()*9000)+1000);
  return `<div class="no-print"><h2>預約報表</h2><p class="hint">請確認內容。一式兩聯：申請人聯自行留存，管理人聯簽名後交回機台管理人員。</p></div>
  ${copyHtml("申請人聯")}<div class="cut">✂ - - - - - - - - - - - - - - - -</div>${copyHtml("管理人聯")}
  <div class="btns"><button class="b" data-act="prev">返回修改</button><button class="b" data-act="restart">新增另一筆預約</button></div>`;
}

/* ----- 讀取表單 / 驗證 ----- */
const v=id=>{const e=document.getElementById(id);return e?e.value.trim():undefined};
function collect(){
  if(S.step===1){const a=S.applicant;["name","sid","dept","advisor","email","phone","account","note"].forEach(k=>{const x=v("a_"+k);if(x!==undefined)a[k]=x})}
  if(S.step===3){
    if(v("c_topic")!==undefined){S.consult.topic=v("c_topic");S.consult.detail=v("c_detail");S.consult.prefer=v("c_prefer")}
    if(v("o_ref")!==undefined){["ref","count","type","size","solvent","repeat","hours","date","note"].forEach(k=>S.order[k]=v("o_"+k))}
    if(v("t_round")!==undefined)S.training.round=v("t_round");
    if(v("r0_trainee")!==undefined)S.exam.records=[0,1,2].map(i=>({trainee:v(`r${i}_trainee`),trainer:v(`r${i}_trainer`),date:v(`r${i}_date`),hours:v(`r${i}_hours`)}));
    if(v("u_purpose")!==undefined){S.self.purpose=v("u_purpose");S.self.samples=v("u_samples")}
  }
}
function validate(){
  const miss=[];
  const need=(id,label)=>{const e=document.getElementById(id);if(e&&!e.value.trim()){e.classList.add("invalid");miss.push(label)}};
  if(S.step===1){need("a_name","姓名");need("a_sid","學號");need("a_advisor","指導教授");need("a_email","Email")}
  if(S.step===3){
    const k=currentKind();
    if(k==="consult"){need("c_topic","諮詢主題");need("c_detail","實驗方案說明")}
    if(k==="service"){need("o_ref","諮詢單號");need("o_count","樣品件數");need("o_type","樣品種類");need("o_hours","預估時數")}
    if(k==="exam"){[0,1,2].forEach(i=>{need(`r${i}_trainer`,`第${i+1}次訓練人`);need(`r${i}_date`,`第${i+1}次受訓日期`)})}
    if(k==="self")need("u_purpose","量測目的");
    if(["training","exam","self"].includes(k)&&!S.slots[S.sub.self].length)miss.push("預約時段");
  }
  if(miss.length){const e=$("#err");e.hidden=false;e.textContent="請補上："+miss.join("、")}
  return !miss.length;
}

/* ----- 事件 ----- */
function bind(){
  $("#stage").querySelectorAll("input,select,textarea").forEach(el=>el.addEventListener("input",()=>{el.classList.remove("invalid");if(S.step===3&&el.id==="o_hours"){collect();refreshPrice()}}));
  $("#stage").querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{S.mode=r.value}));
}
function refreshPrice(){const p=$(".pricebar");if(p)p.outerHTML=priceBar()}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-slot],#rail li");if(!t)return;
  if(t.matches("#rail li")){const n=+t.dataset.s;if(n<S.step){collect();S.step=n;render()}return}
  if(t.dataset.tab){collect();const [g,k]=t.dataset.tab.split(":");S.sub[g]=k;render();return}
  if(t.dataset.slot){
    collect();const [kind,d,h]=t.dataset.slot.split("|"),key=d+"|"+h,arr=S.slots[kind],max=kind==="use"?CONFIG.maxSelfHours:1,i=arr.indexOf(key);
    if(i>=0)arr.splice(i,1);else{if(max===1)arr.length=0;else if(arr.length>=max){const er=$("#err");er.hidden=false;er.textContent=`單次最多預約 ${max} 小時`;return}arr.push(key)}
    render();return}
  const a=t.dataset.act;collect();
  if(a==="next"){if(!validate())return;S.step++;if(S.step===4)S.appNo="";render();window.scrollTo({top:0})}
  if(a==="prev"){S.step--;render()}
  if(a==="wprev"){S.weekOffset--;render()}
  if(a==="wnext"){S.weekOffset++;render()}
  if(a==="clear"){S.isExample=false;Object.keys(S.applicant).forEach(k=>S.applicant[k]="");S.applicant.dept=CONFIG.departments[0];S.consult={topic:"",detail:"",prefer:""};S.self={purpose:"",samples:1};render()}
  if(a==="restart"){S.step=2;S.slots={training:[],exam:[],use:[]};S.appNo="";render()}
});

/* 範例：預先選好兩個自行操作時段 */
(function seed(){const d=weekDays();for(const day of d.slice(1))for(const h of [13,14]){const k=ymd(day)+"|"+h;if(!isBusy(k)&&S.slots.use.length<2&&(!S.slots.use.length||S.slots.use[0].startsWith(ymd(day))))S.slots.use.push(k)}})();
$("#rateChips").innerHTML=Object.entries(CONFIG.rates).filter(([k])=>k!=="consult").map(([k,r])=>`<span class="rate-chip">${RATE_LABEL[k]} <b>${r}</b>/hr</span>`).join("");
render();
</script>

</body>
