<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTA 機台預約系統</title>
<!--
  NTA 機台預約系統（單一檔案版）
  ・預約頁：直接開啟本檔案
  ・簽退頁：網址後面加上 #checkout
  ・管理頁：網址後面加上 #admin
  ・設定（資料庫網址、費率、時段）：請修改下方第一段 <script> 裡的 CONFIG
-->
<script>
/* =====================================================================
   NTA 預約系統 — 共用設定與功能（申請頁 index.html、管理頁 admin.html 共用）
   ===================================================================== */

/* ========= 設定區：部署時只要改這裡 ========= */
const CONFIG = {
  // 部署 Google Apps Script 後，把 Web App 網址貼在這裡（見 README）。
  // 留空 = 示範模式：資料只存在目前這個瀏覽器，別人看不到。
  apiUrl: "https://script.google.com/macros/s/AKfycbxZuAXyiHFgvRcFwOBe8ZINKXKTqA9QoC7-D7hD0EGqVm8YQ7AM989QeGq_i6dt_hJs/exec",

  unit: "國立清華大學 NTA 機台管理單位",          // 報表抬頭
  instrument: "奈米粒子追蹤分析儀 (NTA)",
  // 收費身分（申請人於第一步選擇，管理人員核對）
  rateGroups: [
    { id: "coe",      label: "清大工學院" },
    { id: "nthu",     label: "清大（工學院以外）" },
    { id: "academic", label: "學界（校外學術單位）" },
    { id: "industry", label: "業界" }
  ],
  // 收費標準（NT$），依 2026 年 NTA（Nanosight）使用收費表
  rates: {
    self:     { sponsor: 300,  coe: 400,  nthu: 500,  academic: 750,  industry: 1000 },  // 自行操作，元/hr
    service:  { sponsor: 750,  coe: 750,  nthu: 750,  academic: 1000, industry: 1750 },  // 代工量測，元/hr
    training: { sponsor: 3000, coe: 3000, nthu: 3000, academic: 3000, industry: 5000 }   // 訓練課程（訓練＋考核），元/套
  },
  // 先期贊助（配合款）教授：會列在「收費身分」下拉選單，選擇後適用 rates 裡的 sponsor 價格
  sponsorAdvisors: ["陳玉彬", "李明蒼", "黃振煌", "黃郁棻", "林幸瑩", "魯才德", "蔡德豪", "陳之碩", "王玉麟"],
  billUnitMinutes: 15,                           // 簽退計費單位（分鐘），不足一單位以一單位計
  selfCheckoutDays: 7,                           // 預約開始後幾天內可自行簽退（超過由管理人員代為簽退）
  paymentNote: "請於收到繳費單後依機台管理單位指示完成繳費；校內計畫經費請辦理經費轉帳。",  // 繳費單上的繳費說明
  hours: [10, 11, 12, 13, 14, 15, 16],            // 可預約起始時段（10:00–17:00，每格 1 小時）
  maxSelfHours: 4,                               // 自行操作單次最多時數
  weeksAhead: 8,                                 // 開放預約幾週內的時段
  leadDays: 3,                                   // 需提前幾天預約（以日期計：今天 11/24 → 最早可預約 11/27）
  // 機台訓練與考核只開放以下時段（每週重複）；自行操作不受限制。weekday 1=週一…5=週五；fromHour／toHour 不填代表整天
  trainingWindows: [
    { weekday: 2, fromHour: 14, label: "週二 14:00 後" },
    { weekday: 3, label: "週三整天" },
    { weekday: 4, label: "週四白天" }
  ],
  trainingKinds: ["training", "exam"],           // 套用上述時段限制的預約類型（機台訓練、機台考核）
  maxTrainees: 6,                                // 機台訓練一次最多幾人
  trainingPerPerson: true,                       // true = 訓練課程費用按人數計（每人一套）
  departments: ["動力機械工程學系", "奈米工程與微系統研究所", "化學工程學系", "材料科學工程學系", "醫學科學系", "生命科學系", "分析與環境科學研究所", "校外單位", "其他（請於備註說明）"]
};
/* ========================================== */

const DEMO = !CONFIG.apiUrl;
const DEMO_ADMIN_KEY = "demo";

const RATE_LABEL = { consult: "預約諮詢", service: "委託代工", training: "機台訓練", exam: "機台考核", self: "自行操作" };
const groupLabel = id => id === "sponsor" ? "先期贊助" : ((CONFIG.rateGroups.find(g => g.id === id) || {}).label || "—");

/* 先期贊助：指導教授姓名比對名單（忽略空白與「教授／老師」等稱謂） */
function sponsorMatch(advisor) {
  const n = String(advisor || "").replace(/\s|教授|老師|博士/g, "");
  return n ? (CONFIG.sponsorAdvisors.find(x => n.includes(x)) || "") : "";
}
/* 收費身分值：一般身分為 "coe" 等；先期贊助為 "sponsor:教授姓名" */
const sponsorOf = g => String(g || "").startsWith("sponsor:") ? String(g).slice(8) : "";
function billingGroup(a) { return sponsorOf((a || {}).rateGroup) ? "sponsor" : (a || {}).rateGroup; }
function billingLabel(a) {
  const m = sponsorOf((a || {}).rateGroup);
  return m ? `先期贊助（${m} 教授）` : groupLabel((a || {}).rateGroup);
}
function rateGroupOptions(sel) {
  const o = (v, l) => `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(l)}</option>`;
  return `<option value="">請選擇</option>
    <optgroup label="先期贊助教授之學生">${CONFIG.sponsorAdvisors.map(n => o("sponsor:" + n, `先期贊助－${n} 教授`)).join("")}</optgroup>
    <optgroup label="一般收費">${CONFIG.rateGroups.map(g => o(g.id, g.label)).join("")}</optgroup>`;
}

/* 計價：回傳 {rate, unit, qty, cost, note}
   ・訓練課程按「套」收費（含 3 次訓練＋考核），於預約第 1 次訓練時計費；第 2、3 次訓練與考核不另收費 */
function priceFor(kind, group, { hours = 0, round = "1", people = 1 } = {}) {
  const R = CONFIG.rates;
  if (kind === "consult") return { rate: 0, unit: "hr", qty: 0, cost: 0, note: "諮詢不收費" };
  if (kind === "service") { const r = R.service[group] || 0; return { rate: r, unit: "hr", qty: hours, cost: r * hours, note: "代工量測" }; }
  if (kind === "self") { const r = R.self[group] || 0; return { rate: r, unit: "hr", qty: hours, cost: r * hours, note: "自行操作" }; }
  const r = R.training[group] || 0;
  const n = CONFIG.trainingPerPerson ? Math.max(1, Number(people) || 1) : 1;
  if (kind === "training" && String(round) === "1") return { rate: r, unit: "套", qty: n, cost: r * n, note: `訓練課程（3 次訓練＋考核）${n > 1 ? "，" + n + " 人" : ""}` };
  return { rate: r, unit: "套", qty: 0, cost: 0, note: "已含於訓練課程費用" };
}
function priceTableHtml(highlight) {
  const R = CONFIG.rates, c = n => n.toLocaleString("zh-TW");
  const groups = [{ id: "sponsor", label: "先期贊助教授之學生" }, ...CONFIG.rateGroups];
  return `<div class="rec-scroll"><table class="rec pricetable"><tr><th>收費身分</th><th>自行操作<br>元/hr</th><th>代工量測<br>元/hr</th><th>訓練課程（訓練＋考核）<br>元/套</th></tr>
    ${groups.map(g => `<tr${g.id === highlight ? ' class="hl"' : ""}><td>${esc(g.label)}</td><td class="mono">${c(R.self[g.id])}</td><td class="mono">${c(R.service[g.id])}</td><td class="mono">${c(R.training[g.id])}</td></tr>`).join("")}</table></div>
    <p class="hint" style="margin:6px 0 0">先期贊助教授：${CONFIG.sponsorAdvisors.map(esc).join("、")}。指導教授在名單上的同學，收費身分請選「先期贊助－教授姓名」。</p>`;
}
const STATUS_LABEL = { pending: "待確認", approved: "已核准", completed: "已結算", rejected: "已退回", cancelled: "已取消" };
const WD = ["一", "二", "三", "四", "五"];
/* 固定不開放與提前預約規則 */
function slotWeekday(k) { return new Date(k.split("|")[0] + "T12:00:00+08:00").getUTCDay(); }
function inTrainingWindow(k) {
  const wd = slotWeekday(k), h = +k.split("|")[1];
  return CONFIG.trainingWindows.some(r => r.weekday === wd && (r.fromHour == null || h >= r.fromHour) && (r.toHour == null || h < r.toHour));
}
const isTrainingKind = kind => CONFIG.trainingKinds.includes(kind);
function earliestBookableDate() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + CONFIG.leadDays); return d; }
function tooEarly(k) { return new Date(k.split("|")[0] + "T00:00:00") < earliestBookableDate(); }
function firstBookableWeekOffset() { return Math.round((mondayOf(earliestBookableDate()) - mondayOf(new Date())) / (7 * 86400e3)); }
function trainingWindowsText() { return CONFIG.trainingWindows.map(r => r.label).join("、"); }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "NT$ " + Number(n || 0).toLocaleString("zh-TW");
const H = h => ({ h });   // 標記「已處理好的 HTML」

/* ----- 日期 ----- */
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekDays(offset) { const m = mondayOf(new Date()); m.setDate(m.getDate() + 7 * offset); return [0, 1, 2, 3, 4].map(i => { const d = new Date(m); d.setDate(m.getDate() + i); return d; }); }
function slotStartDate(k) { const [d, h] = k.split("|"); return new Date(`${d}T${String(h).padStart(2, "0")}:00:00+08:00`); }
const slotCmp = (a, b) => slotStartDate(a) - slotStartDate(b);
function bookingStart(b) { const s = (b.slots || []).slice().sort(slotCmp)[0]; return s ? slotStartDate(s) : null; }
function fmtDuration(min) { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return [h ? h + " 小時" : "", m ? m + " 分鐘" : ""].filter(Boolean).join(" ") || "0 分鐘"; }
/* 結算：自行操作＝預約開始→簽退；代工＝管理人員輸入的分鐘數；訓練＝按套 */
function settle(b, { end, minutes, rate } = {}) {
  const U = CONFIG.billUnitMinutes, r = rate != null && rate !== "" ? Number(rate) : Number(b.rate || 0);
  const endAt = end ? new Date(end) : new Date();
  if (b.unit === "套" || b.kind === "consult") return { checkoutAt: endAt.toISOString(), billStart: "", billMinutes: 0, billRate: r, billAmount: b.kind === "consult" ? 0 : Number(b.cost || 0) };
  let mins, start = "";
  if (minutes != null && minutes !== "") mins = Number(minutes);
  else { const st = bookingStart(b); if (!st) throw new Error("這筆預約沒有時段，請輸入實際分鐘數"); start = st.toISOString(); mins = (endAt - st) / 60000; }
  if (!(mins > 0)) throw new Error("簽退時間必須晚於預約開始時間");
  const billMinutes = Math.ceil(mins / U) * U;
  return { checkoutAt: endAt.toISOString(), billStart: start, billMinutes, billRate: r, billAmount: Math.round(r * billMinutes / 60) };
}
/* 自行簽退：申請人選擇使用結束時間（15 分鐘一格，不能晚於現在） */
function endOptions(b, now = new Date()) {
  const st = bookingStart(b), U = CONFIG.billUnitMinutes * 60000, out = [];
  if (!st) return out;
  const max = Math.min(st.getTime() + Math.ceil((now - st) / U) * U, st.getTime() + 24 * 3600e3);
  for (let t = st.getTime() + U; t <= max; t += U) out.push(new Date(t));
  return out;
}
function checkUserEnd(b, end, now = new Date()) {
  const st = bookingStart(b), U = CONFIG.billUnitMinutes * 60000, e = new Date(end);
  if (!end || isNaN(e)) throw new Error("請選擇使用結束時間");
  if (now < st) throw new Error("預約時段尚未開始，無法簽退");
  if (now - st > CONFIG.selfCheckoutDays * 86400e3) throw new Error(`預約開始已超過 ${CONFIG.selfCheckoutDays} 天，請聯絡機台管理人員代為簽退`);
  if (e <= st) throw new Error("結束時間必須晚於預約開始時間");
  if ((e - st) % U) throw new Error(`結束時間請以 ${CONFIG.billUnitMinutes} 分鐘為單位`);
  if (e - now > U) throw new Error("結束時間不能晚於現在");
  return e;
}
function fmtSlot(k) { const [d, h] = k.split("|"); return `${d} ${String(h).padStart(2, "0")}:00–${String(+h + 1).padStart(2, "0")}:00`; }
function slotIsPast(k) { const [d, h] = k.split("|"); const t = new Date(d + "T00:00:00"); t.setHours(+h); return t < new Date(); }
function fmtDateTime(iso) { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? String(iso) : ymd(d) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

/* =====================================================================
   API：有 apiUrl 就呼叫 Google Apps Script；沒有就用瀏覽器內的示範資料庫
   ===================================================================== */
const LocalDB = {
  KEY: "nta_demo_db_v1", _mem: null,
  load() { try { const s = localStorage.getItem(this.KEY); if (s) return JSON.parse(s); } catch (e) { } return this._mem || { bookings: [], locks: {} }; },
  save(db) { this._mem = db; try { localStorage.setItem(this.KEY, JSON.stringify(db)); } catch (e) { } },
  slotMap(db) {
    const m = {};
    for (const b of db.bookings) if (["pending", "approved", "completed"].includes(b.status))
      for (const s of b.slots || []) m[s] = { state: b.status === "pending" ? "pending" : "booked", id: b.id };
    for (const [k, v] of Object.entries(db.locks)) m[k] = { state: "locked", reason: v.reason || "" };
    return m;
  },
  newId(ids) {
    const p = "NTA-" + ymd(new Date()).replace(/-/g, "") + "-"; let n = 1;
    while (ids.includes(p + String(n).padStart(3, "0"))) n++;
    return p + String(n).padStart(3, "0");
  },
  async handle(action, d) {
    const db = this.load();
    if (action === "slots") { const m = this.slotMap(db); for (const k in m) delete m[k].id; return { slots: m }; }
    if (action === "book") {
      const m = this.slotMap(db), c = (d.booking.slots || []).filter(s => m[s]);
      if (c.length) throw new Error("CONFLICT:" + c.join(","));
      const b = { ...d.booking, id: this.newId(db.bookings.map(x => x.id)), createdAt: new Date().toISOString(), status: "pending", adminNote: "" };
      db.bookings.push(b); this.save(db); return { id: b.id, status: b.status, createdAt: b.createdAt };
    }
    const find = () => {
      const b = db.bookings.find(x => x.id === String(d.id || "").trim().toUpperCase());
      if (!b || String((b.applicant || {}).email || "").toLowerCase() !== String(d.email || "").trim().toLowerCase()) throw new Error("找不到這筆預約，請確認申請編號與 Email");
      return b;
    };
    if (action === "lookup") return { booking: find(), now: new Date().toISOString() };
    if (action === "lookup_email") {
      const em = String(d.email || "").trim().toLowerCase();
      if (!em) throw new Error("請輸入 Email");
      return { bookings: db.bookings.filter(b => String((b.applicant || {}).email || "").toLowerCase() === em).slice().reverse().slice(0, 30), now: new Date().toISOString() };
    }
    if (action === "checkout") {
      const b = find();
      if (b.status === "completed") throw new Error("這筆預約已經簽退結算過了");
      if (b.status !== "approved") throw new Error("預約尚未核准，無法簽退");
      if (b.kind !== "self") throw new Error("此類預約由管理人員結算，不需簽退");
      const e = checkUserEnd(b, d.end);
      Object.assign(b, settle(b, { end: e.toISOString() }), { status: "completed", settledBy: "user", submittedAt: new Date().toISOString() }); this.save(db);
      return { booking: b };
    }
    if (action.startsWith("admin_") && d.key !== DEMO_ADMIN_KEY) throw new Error("管理密碼錯誤");
    if (action === "admin_complete") {
      const b = db.bookings.find(x => x.id === d.id); if (!b) throw new Error("找不到這筆預約");
      Object.assign(b, settle(b, { end: d.end, minutes: d.minutes, rate: d.rate }), { status: "completed", settledBy: "admin" });
      if (d.note != null) b.adminNote = d.note; this.save(db); return { ok: true };
    }
    if (action === "admin_list") return { bookings: db.bookings.slice().reverse(), locks: db.locks };
    if (action === "admin_status") {
      const b = db.bookings.find(x => x.id === d.id); if (!b) throw new Error("找不到這筆預約");
      b.status = d.status; if (d.note != null) b.adminNote = d.note; this.save(db); return { ok: true };
    }
    if (action === "admin_lock") { for (const s of d.slots) db.locks[s] = { reason: d.reason || "", at: new Date().toISOString() }; this.save(db); return { ok: true }; }
    if (action === "admin_unlock") { for (const s of d.slots) delete db.locks[s]; this.save(db); return { ok: true }; }
    throw new Error("未知的動作：" + action);
  }
};

const Api = {
  async call(action, data = {}) {
    if (DEMO) return LocalDB.handle(action, JSON.parse(JSON.stringify(data)));
    // text/plain 可避免瀏覽器的 CORS 預檢，Apps Script 才收得到
    // 每次最多等 15 秒；逾時或連線失敗自動重試一次（Google 冷啟動時第一次可能較慢）
    const once = async () => {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
      try {
        const r = await fetch(CONFIG.apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, ...data }), signal: ctl.signal });
        if (!r.ok) throw new Error("伺服器回應錯誤（" + r.status + "）");
        const txt = await r.text();
        try { return JSON.parse(txt); } catch (e) { throw new Error("資料庫回傳格式不正確，請確認 Apps Script 部署設定（存取權需為「所有人」）"); }
      } finally { clearTimeout(to); }
    };
    const readOnly = ["slots", "lookup", "lookup_email", "admin_list", "ping"].includes(action);
    let j;
    try { j = await once(); }
    catch (e) {
      if (!readOnly && e.name !== "AbortError" && !/fetch/i.test(e.message)) throw e;
      if (!readOnly) throw new Error("連線逾時，請稍後再試。若已送出，請先到管理頁或簽退頁確認，避免重複送出。");
      try { j = await once(); }
      catch (e2) { throw new Error(e2.name === "AbortError" ? "Google 伺服器回應逾時，請稍後再試一次。" : "連不上資料庫。請確認網路連線；若是在檔案預覽視窗中開啟，請改用正式網址開啟網站。"); }
    }
    if (j.error) throw new Error(j.error);
    return j;
  }
};
function conflictSlots(err) { const m = String(err.message || "").match(/^CONFLICT:(.*)$/); return m ? m[1].split(",") : null; }

/* =====================================================================
   週曆
   map: { "YYYY-MM-DD|H": {state:"pending"|"booked"|"locked", id?, reason?} }
   ===================================================================== */
function calendarHtml({ offset, minOffset, maxOffset, map = {}, selected = [], admin = false, focusId = "", kind = "" }) {
  const trainOnly = !admin && isTrainingKind(kind);
  const days = weekDays(offset);
  const head = `<tr><th class="time"></th>${days.map((d, i) => `<th>週${WD[i]}<br><span class="mono">${d.getMonth() + 1}/${d.getDate()}</span>${admin ? `<br><button class="daybtn" data-day="${ymd(d)}">整天鎖定</button>` : ""}</th>`).join("")}</tr>`;
  const rows = CONFIG.hours.map(h => `<tr><th class="time">${String(h).padStart(2, "0")}:00</th>${days.map(d => {
    const key = ymd(d) + "|" + h, info = map[key], on = selected.includes(key), past = slotIsPast(key), rule = trainOnly && !inTrainingWindow(key);
    let cls = "slot", label = "", dis = false, title = fmtSlot(key);
    if (rule && !info) { cls += " locked closed"; label = "非訓練時段"; title += "｜訓練／考核只開放 " + trainingWindowsText(); dis = true; }
    else if (info) {
      cls += " " + info.state;
      label = { pending: "待確認", booked: "已預約", locked: "暫停開放" }[info.state];
      if (admin && info.state === "locked" && info.reason) label = info.reason;
      if (info.reason) title += "｜" + info.reason;
      if (!admin) dis = true;
      if (admin && info.id && info.id === focusId) cls += " focus";
    } else if (on) { cls += " sel"; label = "✓"; }
    if (past) { cls += " past"; if (!admin) dis = true; }
    else if (!admin && !rule && !info && tooEarly(key)) { cls += " past"; dis = true; title += `｜需提前 ${CONFIG.leadDays} 天預約`; }
    return `<td><button class="${cls}" data-slot="${key}" title="${esc(title)}"${dis ? " disabled" : ""}>${esc(label)}</button></td>`;
  }).join("")}</tr>`).join("");
  return `<div class="weeknav"><button class="b ghost" data-act="wprev"${offset <= minOffset ? " disabled" : ""}>‹ 上一週</button>
    <span class="mono">${ymd(days[0])} – ${ymd(days[4])}</span><button class="b ghost" data-act="wnext"${offset >= maxOffset ? " disabled" : ""}>下一週 ›</button></div>
  <div class="cal-scroll"><table class="cal">${head}${rows}</table></div>
  <div class="legend"><span><i></i>可預約</span>${admin ? "" : `<span><i style="background:var(--accent);border-color:var(--accent)"></i>已選取</span>`}<span><i style="background:var(--warn-soft);border-color:transparent"></i>待確認</span><span><i style="background:var(--busy);border-color:transparent"></i>已預約</span><span><i style="background:repeating-linear-gradient(135deg,var(--busy) 0 4px,var(--surface) 4px 7px)"></i>${trainOnly ? "非訓練時段／暫停開放" : "暫停開放"}</span>${admin ? "" : `<span><i style="opacity:.45"></i>未滿 ${CONFIG.leadDays} 天或已過去，不能預約</span>`}</div>
  ${admin ? "" : `<p class="hint" style="margin:4px 0 0">預約需提前 ${CONFIG.leadDays} 天。${trainOnly ? `機台訓練與考核只開放：<b>${esc(trainingWindowsText())}</b>。` : ""}</p>`}`;
}

/* =====================================================================
   預約申請單：固定三頁 A4（申請人聯／管理人聯／切結書），內容過多時自動縮放成一頁
   booking 物件格式：{id, createdAt, status, mode, kind, applicant:{...}, slots:[], hours, rate, cost, details:{...}}
   ===================================================================== */
function detailRows(b) {
  const d = b.details || {}, k = b.kind;
  const rows = [["服務類型", (b.mode === "service" ? "委託代工" : "自行操作") + "　—　" + RATE_LABEL[k]]];
  if (k === "consult") rows.push(["諮詢主題", d.topic], ["實驗方案說明", d.detail], ["方便諮詢時間", d.prefer || "—"]);
  if (k === "service") rows.push(["諮詢單號", d.ref], ["樣品件數／種類", `${d.count} 件　${d.type}`], ["預期粒徑／分散液", `${d.size || "—"} nm　${d.solvent || "—"}`], ["每件量測次數", d.repeat || "—"], ["希望完成日期", d.date || "—"], ["實驗內容／特殊需求", d.note || "—"]);
  if (k === "training") rows.push(["訓練次別", `第 ${d.round} 次（共 3 次）`], ["受訓人員", `${(d.trainees || []).filter(Boolean).join("、") || "—"}（共 ${d.people || 1} 人）`]);
  if (k === "exam") rows.push(["訓練紀錄", H(`<table class="pt inner"><tr><th>#</th><th>受訓人</th><th>訓練人</th><th>受訓日期</th><th>時數</th></tr>${(d.records || []).map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.trainee)}</td><td>${esc(r.trainer)}</td><td>${esc(r.date)}</td><td>${esc(r.hours)}</td></tr>`).join("")}</table>`)]);
  if (k === "self") rows.push(["量測目的／樣品", `${d.purpose}（${d.samples || "—"} 件）`]);
  if ((b.slots || []).length) rows.push(["預約時段", H(b.slots.slice().sort(slotCmp).map(fmtSlot).join("<br>"))]);
  const unit = b.unit || "hr", note = b.priceNote ? `（${esc(b.priceNote)}）` : "";
  rows.push(["收費身分", billingLabel(b.applicant)],
    ["計價方式", H(`${money(b.rate)} / ${unit}${note}`)],
    ["預估數量／報價金額", H(`${b.hours} ${unit}　／　<b>${money(b.cost)}</b>`)]);
  if (k === "self") rows.push(["計費說明", `實際費用依「預約開始時間」至「簽退時間」計算，每 ${CONFIG.billUnitMinutes} 分鐘為一計費單位，不足一單位以一單位計，以繳費單為準。`]);
  if (k === "service") rows.push(["計費說明", `實際費用依實際量測時間計算，每 ${CONFIG.billUnitMinutes} 分鐘為一計費單位，以繳費單為準。`]);
  return rows;
}
function ptable(rows) { return `<table class="pt">${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v && v.h !== undefined ? v.h : esc(v).replace(/\n/g, "<br>")}</td></tr>`).join("")}</table>`; }
function applicantTable(a) {
  const c = v => esc(v || "—");
  return `<table class="pt"><tr><th>申請人姓名</th><td>${c(a.name)}</td><th>學號／員編</th><td>${c(a.sid)}</td></tr>
  <tr><th>所屬系所</th><td>${c(a.dept)}</td><th>指導教授</th><td>${c(a.advisor)}</td></tr>
  <tr><th>Email</th><td>${c(a.email)}</td><th>聯絡電話</th><td>${c(a.phone)}</td></tr>
  <tr><th>經費來源</th><td colspan="3">${c(a.account)}</td></tr>
  ${a.note ? `<tr><th>備註</th><td colspan="3">${esc(a.note).replace(/\n/g, "<br>")}</td></tr>` : ""}</table>`;
}
const SIGS = `<div class="sigs">${["申請人簽名", "指導教授簽名", "機台管理人員簽名"].map(s => `<div class="sig"><span>${s}</span><span class="d">日期：　　　年　　月　　日</span></div>`).join("")}</div>`;

function reportPages(b) {
  const id = b.id || "（送出後產生）", date = b.createdAt ? ymd(new Date(b.createdAt)) : ymd(new Date());
  const head = (label) => `<h1 class="ptitle">${esc(CONFIG.instrument)} 預約報價單</h1><div class="copy">【 ${label} 】</div>
    <div class="meta"><span>申請編號：${esc(id)}</span><span>申請日期：${date}</span><span>${esc(CONFIG.unit)}</span></div>`;
  const foot = (n, label) => `<div class="pfoot"><span>${esc(CONFIG.unit)}</span><span>${esc(id)}　·　${label}　·　第 ${n} 頁／共 3 頁</span></div>`;
  const copy = (n, label, extra) => `<div class="a4"><div class="fit">${head(label)}
      <h4>一、申請人基本資料</h4>${applicantTable(b.applicant || {})}
      <h4>二、預約確認資料</h4>${ptable(detailRows(b))}
      <h4>三、簽章</h4>${SIGS}${extra || ""}</div>${foot(n, label)}</div>`;
  const office = `<div class="office"><b>管理單位填寫</b><div class="row" style="margin-top:6px">
      <span>收件日期：＿＿＿＿＿＿＿＿</span><span>審核結果：□ 核准　□ 退回</span>
      <span>經手人：＿＿＿＿＿＿＿＿</span><span>備註：＿＿＿＿＿＿＿＿＿＿</span></div></div>`;
  const selfOp = b.mode === "self", a = b.applicant || {};
  const affidavit = `<div class="a4${selfOp ? "" : " na"}"><div class="fit">
      <h1 class="ptitle keep">機台使用切結書</h1>
      <div class="copy keep">【 自行操作人員填寫 】</div>
      <div class="meta keep"><span>申請編號：${esc(id)}</span><span>申請日期：${date}</span><span>${esc(CONFIG.unit)}</span></div>
      ${selfOp ? "" : `<div class="na-banner keep">本次申請為「委託代工」，免填本切結書</div>`}
      <table class="pt" style="margin-top:6px"><tr><th>立切結書人</th><td>${esc(a.name)}</td><th>學號／員編</th><td>${esc(a.sid)}</td></tr>
        <tr><th>所屬系所</th><td>${esc(a.dept)}</td><th>指導教授</th><td>${esc(a.advisor)}</td></tr>
        <tr><th>使用項目</th><td colspan="3">${esc(RATE_LABEL[b.kind])}${(b.slots || []).length ? "　共 " + b.slots.length + " 小時（" + esc(b.slots.slice().sort(slotCmp)[0].split("|")[0]) + " 起）" : ""}</td></tr></table>
      <p style="margin-top:14px">立切結書人（以下稱申請人）向${esc(CONFIG.unit)}申請自行操作${esc(CONFIG.instrument)}，茲聲明並同意遵守下列事項：</p>
      <ol class="terms">
        <li>申請人已接受機台操作訓練並通過考核，將依標準作業程序（SOP）及管理人員指示操作，不擅自變更儀器設定、拆卸零組件，或使用未經核准之樣品與溶劑。</li>
        <li>使用前應確認機台狀態並登記使用紀錄；使用後應依規定清潔樣品槽與管路，並恢復機台至待機狀態。</li>
        <li>使用期間如發生異常狀況，應立即停止操作並通知機台管理人員，不得自行排除故障。</li>
        <li>於自行操作期間，因操作不當、違反使用規範或其他可歸責於申請人之事由，致設備損壞或故障者，申請人應負照價賠償及維修費用之責任，指導教授負督導之責。</li>
        <li>違反上述規定者，管理單位得暫停或取消其機台使用資格。</li>
      </ol>
      <p>申請人已詳閱並充分瞭解上述條款，願遵守之，特立此書為憑。</p>
      <p>此致　${esc(CONFIG.unit)}</p>
      <h4>簽章</h4>${SIGS}
      <p style="text-align:center;margin-top:22px;letter-spacing:.3em">中　華　民　國　　　　年　　　　月　　　　日</p>
    </div>${foot(3, "切結書")}</div>`;
  return [copy(1, "申請人聯"), copy(2, "管理人聯", office), affidavit];
}

/* 繳費單：簽退／結算後產生，兩頁（申請人聯／管理單位聯） */
function billPages(b) {
  const id = b.id || "", a = b.applicant || {}, unit = b.unit || "hr";
  const usage = [["服務類型", (b.mode === "service" ? "委託代工" : "自行操作") + "　—　" + RATE_LABEL[b.kind]]];
  if ((b.slots || []).length) usage.push(["預約時段", H(b.slots.slice().sort(slotCmp).map(fmtSlot).join("<br>"))]);
  if (b.billStart) usage.push(["計費起始（預約開始）", fmtDateTime(b.billStart)]);
  if (b.kind === "self") usage.push(["使用結束時間", fmtDateTime(b.checkoutAt) + (b.settledBy === "admin" ? "（管理人員登錄）" : "（申請人填寫）")]);
  if (b.kind === "self" && b.submittedAt) usage.push(["簽退送出時間", fmtDateTime(b.submittedAt)]);
  else usage.push(["結算日期", fmtDateTime(b.checkoutAt)]);
  usage.push(["收費身分", billingLabel(a)]);
  if (unit === "套") usage.push(["計費方式", `${money(b.billRate)} / 套 × ${b.hours || 1}（${esc(b.priceNote || "訓練課程")}）`]);
  else usage.push(["計費時間", `${fmtDuration(b.billMinutes)}（${b.billMinutes / CONFIG.billUnitMinutes} 單位 × ${CONFIG.billUnitMinutes} 分鐘）`],
    ["單價", `${money(b.billRate)} / hr`]);
  if (b.kind === "training" && (b.details || {}).trainees) usage.push(["受訓人員", (b.details.trainees || []).filter(Boolean).join("、")]);
  usage.push(["應繳金額", H(`<b style="font-size:16px">${money(b.billAmount)}</b>`)]);
  if (b.adminNote) usage.push(["備註", b.adminNote]);
  const page = (n, label, extra) => `<div class="a4"><div class="fit">
      <h1 class="ptitle">${esc(CONFIG.instrument)} 使用繳費單</h1><div class="copy">【 ${label} 】</div>
      <div class="meta"><span>申請編號：${esc(id)}</span><span>開立日期：${ymd(new Date(b.checkoutAt || Date.now()))}</span><span>${esc(CONFIG.unit)}</span></div>
      <h4>一、申請人基本資料</h4>${applicantTable(a)}
      <h4>二、使用紀錄與費用</h4>${ptable(usage)}
      <h4>三、繳費說明</h4><p style="margin:0 0 6px">${esc(CONFIG.paymentNote)}</p>
      <h4>四、簽章</h4>${SIGS}${extra || ""}</div>
      <div class="pfoot"><span>${esc(CONFIG.unit)}</span><span>${esc(id)}　·　繳費單 ${label}　·　第 ${n} 頁／共 2 頁</span></div></div>`;
  const office = `<div class="office"><b>管理單位填寫</b><div class="row" style="margin-top:6px">
      <span>收款日期：＿＿＿＿＿＿＿＿</span><span>收據編號：＿＿＿＿＿＿＿＿</span>
      <span>實收金額：NT$ ＿＿＿＿＿＿</span><span>經手人：＿＿＿＿＿＿＿＿</span></div></div>`;
  return [page(1, "申請人聯"), page(2, "管理單位聯", office)];
}
const reportPagesHtml = b => reportPages(b).join("");

/* 內容太長時把 .fit 等比縮小，確保每張都是一頁 */
function fitPages(root) {
  root.querySelectorAll(".a4").forEach(p => {
    const fit = p.querySelector(".fit"), cs = getComputedStyle(p);
    const avail = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    fit.style.transform = ""; fit.style.width = "";
    let s = 1;
    for (let i = 0; i < 4; i++) {
      const h = fit.scrollHeight * s;
      if (h <= avail + 0.5) break;
      s = s * avail / h;
      fit.style.width = (100 / s) + "%"; fit.style.transform = `scale(${s})`;
    }
  });
}

/* 預覽：把三張 A4 縮放到容器寬度 */
function mountPreview(container, b) {
  container.innerHTML = `<div class="pages">${reportPages(b).map(p => `<div class="pagebox">${p}</div>`).join("")}</div>`;
  const pages = container.querySelector(".pages");
  const resize = () => { const s = Math.min(1, (container.clientWidth - 2) / 794); pages.style.setProperty("--s", s); };
  resize(); fitPages(pages);
  if (container._ro) container._ro.disconnect();
  container._ro = new ResizeObserver(resize); container._ro.observe(container);
  if (document.fonts) document.fonts.ready.then(() => fitPages(pages));
}

/* 下載 PDF：type = "quote"（報價單 3 頁）或 "bill"（繳費單 2 頁） */
async function downloadPdf(b, type = "quote") {
  if (!window.html2canvas || !window.jspdf) throw new Error("PDF 元件載入失敗，請檢查網路後重新整理");
  const host = document.createElement("div");
  host.id = "pdfhost";
  host.style.cssText = "position:absolute;left:0;top:0;width:794px;visibility:hidden;pointer-events:none;z-index:-1";
  host.innerHTML = (type === "bill" ? billPages(b) : reportPages(b)).join("");
  document.body.appendChild(host);
  try {
    if (document.fonts) await document.fonts.ready;
    fitPages(host);
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    const pages = host.querySelectorAll(".a4");
    for (let i = 0; i < pages.length; i++) {
      const canvas = await html2canvas(pages[i], {
        scale: 2, backgroundColor: "#ffffff", scrollX: 0, scrollY: -window.scrollY, windowWidth: document.documentElement.clientWidth,
        onclone: doc => { const h = doc.getElementById("pdfhost"); if (h) h.style.visibility = "visible"; }
      });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
    }
    pdf.save(`NTA${type === "bill" ? "繳費單" : "報價單"}_${b.id || "草稿"}_${(b.applicant || {}).name || ""}.pdf`);
  } finally { host.remove(); }
}

.opt small{color:var(--muted);font-size:.82rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:700}
.tabs .count{font-family:var(--f-mono);font-size:.72rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:4px}

.pricebar{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;margin-top:18px;padding:12px 14px;border:1px dashed var(--accent);border-radius:6px;background:var(--accent-soft);font-size:.9rem}
.pricebar .big{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* calendar */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 8px}
.cal-scroll{overflow-x:auto}
table.cal{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;font-size:.78rem}
table.cal th{font-weight:500;color:var(--muted);padding:2px}
table.cal th.time{font-family:var(--f-mono);text-align:right;padding-right:6px;width:48px}
table.cal td{padding:0}
.slot{width:100%;height:32px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;font-size:.7rem;color:var(--muted);padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{cursor:not-allowed}
.slot.pending{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.slot.booked{background:var(--busy);color:var(--busy-ink);border-color:transparent}
.slot.locked{background:repeating-linear-gradient(135deg,var(--busy) 0 6px,var(--surface) 6px 10px);color:var(--lock);border-color:var(--line)}
.slot.past{opacity:.45}
.slot.sel{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.slot.focus{outline:2px solid var(--accent);outline-offset:1px}
.daybtn{font:inherit;font-size:.68rem;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}

table.rec{width:100%;border-collapse:collapse;font-size:.88rem}
table.rec th,table.rec td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
table.rec th{color:var(--muted);font-weight:500;font-size:.78rem}
table.rec input{padding:6px 8px;font-size:.88rem}
.rec-scroll{overflow-x:auto}
.rec-scroll table{min-width:560px}

.btns{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.btns .right{display:flex;flex-wrap:wrap;gap:10px}
.b{font:inherit;font-size:.92rem;border-radius:6px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.b:disabled{opacity:.5;cursor:not-allowed}
.b.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.b.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.b.danger{color:var(--bad);border-color:var(--bad)}
.b.sm{font-size:.82rem;padding:5px 12px}
.b.ghost{border-color:transparent;color:var(--muted);padding-inline:8px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px}
.notice{border-radius:6px;padding:12px 14px;font-size:.9rem;margin-bottom:16px}
.notice.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.notice.ok b{color:var(--ok)}

.pill{display:inline-block;font-size:.74rem;border-radius:10px;padding:1px 9px;font-weight:500;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected,.pill.cancelled{background:var(--bad-soft);color:var(--bad)}

/* admin list */
.blist{display:flex;flex-direction:column;gap:10px}
.bitem{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);min-width:0}
.bitem.pending{border-left:4px solid var(--warn)}
.bitem.approved{border-left:4px solid var(--ok)}
.bitem.rejected,.bitem.cancelled{border-left:4px solid var(--bad);opacity:.8}
.bhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.bhead .who{font-weight:700}
.bmeta{font-size:.82rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.bslots{font-size:.82rem;margin-top:6px;font-family:var(--f-mono)}
.bdetail{font-size:.84rem;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.bdetail dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:0}
.bdetail dt{color:var(--muted)}
.bdetail dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.bactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.bactions input{max-width:280px;padding:5px 8px;font-size:.84rem}
.lockbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;font-size:.85rem}
.lockbar input{max-width:240px;padding:6px 8px}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:.9rem}

/* report: fixed A4 sheets, always paper-white */
.pages{display:flex;flex-direction:column;gap:18px;align-items:center;margin:8px 0}
.pagebox{width:calc(794px * var(--s,1));height:calc(1123px * var(--s,1));position:relative}
.pagebox>.a4{position:absolute;left:0;top:0;transform:scale(var(--s,1));transform-origin:top left;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.a4{width:794px;height:1123px;background:#fff;color:#111;padding:50px 56px 60px;overflow:hidden;font-family:var(--f-body);font-size:13px;line-height:1.55;position:relative}
.a4 .fit{transform-origin:top left}
.a4 .ptitle{font-family:var(--f-display);font-size:21px;text-align:center;margin:0;letter-spacing:.04em}
.a4 .copy{text-align:center;font-size:12px;letter-spacing:.3em;margin:2px 0 12px}
.a4 .meta{display:flex;justify-content:space-between;gap:16px;font-family:var(--f-mono);font-size:11px;border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:10px}
.a4 h4{font-size:13.5px;margin:14px 0 6px;border-left:3px solid #111;padding-left:6px}
.a4 table.pt{width:100%;border-collapse:collapse;table-layout:fixed}
.a4 table.pt th,.a4 table.pt td{border:1px solid #777;padding:4px 7px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.a4 table.pt th{background:#efefef;font-weight:500;width:19%}
.a4 table.pt.inner th{width:auto}
.a4 .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.a4 .sig{border:1px solid #777;height:84px;padding:5px 8px;font-size:11.5px;display:flex;flex-direction:column;justify-content:space-between}
.a4 .sig .d{color:#555}
.a4 .office{margin-top:14px;border:1px dashed #777;padding:8px 10px;font-size:12px}
.a4 .office .row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px}
.a4 .pfoot{position:absolute;left:56px;right:56px;bottom:26px;display:flex;justify-content:space-between;font-size:10.5px;color:#666;border-top:1px solid #ccc;padding-top:5px}
.a4 ol.terms{margin:8px 0 10px;padding-left:1.8em}
.a4 ol.terms li{margin-bottom:6px}
.a4 .na-banner{border:2px solid #111;text-align:center;font-weight:700;padding:6px;margin:10px 0}
.a4.na .fit>*:not(.keep){opacity:.4}

@media (max-width:620px){
  .grid{grid-template-columns:1fr}
  ol.rail li .t{display:none}
}
@media (prefers-reduced-motion:no-preference){.slot{transition:background .12s}}
.pricetable{margin-top:4px}
.pricetable th{white-space:nowrap}
.pricetable td.mono{text-align:right;padding-right:14px}
.pricetable tr.hl td{background:var(--accent-soft);font-weight:700}
.linkbtn{text-decoration:none;display:inline-block;align-self:center}
.sponsor-hint{color:var(--ok);font-size:.8rem;min-height:1em}
.bill-big{font-family:var(--f-mono);font-size:1.6rem;font-weight:500}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.settle{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;font-size:.84rem}
.settle input{max-width:200px;padding:5px 8px;font-size:.84rem}
.pill.completed{background:var(--accent-soft);color:var(--accent)}
.bitem.completed{border-left:4px solid var(--accent)}
.pickrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:.88rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pickrow:hover{border-color:var(--accent)}
.pickrow.on{border-color:var(--accent);background:var(--accent-soft)}
.pickrow .muted{color:var(--muted);font-size:.8rem}
.tagok{margin-left:auto;font-size:.76rem;font-weight:700;color:var(--ok)}

/* 操作說明 */
.guide .rules{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:.92rem}
.guide .rules ul{margin:6px 0 0;padding-left:1.2em}
.guide .rules li{margin:2px 0}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 18px;font-size:.86rem}
.flow span{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:3px 12px}
.flow span.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.flow i{font-style:normal;color:var(--muted)}
.flow small{flex-basis:100%;color:var(--muted)}
.gsteps{list-style:none;margin:0;padding:0;counter-reset:g;display:flex;flex-direction:column;gap:22px}
.gsteps>li{counter-increment:g;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start;border-top:1px solid var(--line);padding-top:18px}
.gsteps h3{font-size:1.02rem;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.gsteps h3::before{content:counter(g);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);font-family:var(--f-mono);font-size:.85rem;flex:none}
.gtext ul{margin:0;padding-left:1.2em;font-size:.9rem}
.gtext li{margin:3px 0}
.gfig{margin:0;min-width:0}
.gfig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08);background:#fff}
.gfig figcaption{font-size:.78rem;color:var(--muted);margin-top:4px}
@media (max-width:720px){.gsteps>li{grid-template-columns:1fr}}

</style>
</head>
<body>
<div id="app"></div>

<template id="tplUser">
<div class="wrap">
  <header class="top">
    <div>
      <div class="tag">Nanoparticle Tracking Analysis</div>
      <h1>NTA 機台預約系統</h1>
      <p class="sub">四步驟完成申請，送出後可下載報價單；使用完畢請記得簽退，系統會依實際時間開立繳費單</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="b linkbtn" data-act="guide">操作說明</button><a class="b primary linkbtn" href="#checkout">實驗結束？前往簽退 →</a></div>
  </header>

  <div class="demo-banner" id="demoBanner" hidden>
    <span><b>示範模式</b>：尚未設定資料庫網址（CONFIG.apiUrl），預約只會存在你這台電腦的瀏覽器，其他人看不到。</span>
    <button class="b ghost sm" data-act="fillExample">填入範例資料</button>
  </div>

  <ol class="rail" id="rail" hidden>
    <li data-s="1"><span class="n">STEP 1</span><span class="t">申請人資料</span></li>
    <li data-s="2"><span class="n">STEP 2</span><span class="t">服務類型</span></li>
    <li data-s="3"><span class="n">STEP 3</span><span class="t">預約內容</span></li>
    <li data-s="4"><span class="n">STEP 4</span><span class="t">確認送出</span></li>
  </ol>

  <main class="card" id="stage"></main>

  <footer class="foot"><span id="unitName"></span><a href="#admin">管理人員登入</a></footer>
</div>
</template>

<template id="tplAdmin">
<div class="wrap">
  <header class="top">
    <div>
      <div class="tag">Nanoparticle Tracking Analysis · Admin</div>
      <h1>NTA 預約管理</h1>
      <p class="sub">審核預約申請、鎖定或開放機台時段</p>
    </div>
    <div class="rates"><a class="rate-chip" href="#" style="text-decoration:none">← 回到預約頁</a><button class="b ghost sm" data-act="logout" id="logoutBtn" hidden>登出</button></div>
  </header>
  <div class="demo-banner" id="demoBanner" hidden><span><b>示範模式</b>：尚未連接資料庫，這裡只看得到「這個瀏覽器」送出的預約，鎖定的時段也只在這台電腦有效。示範密碼：<span class="mono">demo</span></span></div>
  <main class="card" id="stage"></main>
</div>
</template>

<template id="tplCheckout">
<div class="wrap">
  <header class="top">
    <div>
      <div class="tag">Nanoparticle Tracking Analysis · Check-out</div>
      <h1>NTA 使用簽退</h1>
      <p class="sub">實驗結束後請在這裡簽退，系統會依實際使用時間開立繳費單</p>
    </div>
    <a class="b linkbtn" href="#">← 回到預約頁</a>
  </header>
  <div class="demo-banner" id="demoBanner" hidden><span><b>示範模式</b>：尚未設定資料庫網址，只查得到這個瀏覽器送出的預約。</span></div>
  <main class="card" id="stage"></main>
  <footer class="foot"><span id="unitName"></span><a href="#admin">管理人員登入</a></footer>
</div>
</template>

function initUser() {

const S = {
  step: 0,                    // 0 = 操作說明

  slotMap: {}, slotsLoaded: false, slotsError: "",

/* ----- 時段資料 ----- */
async function loadSlots() {
  // 先顯示上次存在這台電腦的時段（立即可用），同時向伺服器取得最新資料
  if (!S.slotsLoaded) {
    try { const c = JSON.parse(localStorage.getItem("nta_slots_cache") || "null"); if (c && Date.now() - c.t < 30 * 60e3) { S.slotMap = c.slots; S.slotsLoaded = true; } } catch (e) { }
  }
  S.slotsRefreshing = true; if (S.step === 3) render();
  try {
    const r = await Api.call("slots"); S.slotMap = r.slots || {}; S.slotsError = "";
    try { localStorage.setItem("nta_slots_cache", JSON.stringify({ t: Date.now(), slots: S.slotMap })); } catch (e) { }
  }
  catch (e) { S.slotsError = "無法載入已預約時段：" + e.message; }
  S.slotsLoaded = true; S.slotsRefreshing = false;
  // 已選但剛被別人預約的時段要移除
  for (const k of Object.keys(S.slots)) S.slots[k] = S.slots[k].filter(s => !S.slotMap[s]);
  if (S.step === 3) render();
}

/* ----- 計價 ----- */
function currentKind() {
  if (S.mode === "service") return S.sub.service === "consult" ? "consult" : "service";
  return { training: "training", exam: "exam", use: "self" }[S.sub.self];
}
function curPrice() {
  return priceFor(currentKind(), billingGroup(S.applicant), { hours: billHours(), round: S.training.round, people: S.training.people });
}
function billHours() {
  const k = currentKind();
  if (k === "consult") return 0;
  if (k === "service") return Number(S.order.hours) || 0;
  return S.slots[S.sub.self].length;
}
function priceBar() {
  const p = curPrice();
  return `<div class="pricebar"><span>收費身分：<b>${esc(billingLabel(S.applicant))}</b></span>
    <span>計價方式：<b class="mono">${money(p.rate)} / ${p.unit}</b>（${esc(p.note)}）</span>
    <span>計費數量：<b class="mono">${p.qty} ${p.unit}</b></span><span>預估費用：<span class="big">${money(p.cost)}</span></span></div>`;
}
function buildBooking() {
  const k = currentKind(), details = {
    consult: { ...S.consult }, service: { ...S.order }, training: { round: S.training.round, people: Number(S.training.people) || 1, trainees: S.training.trainees.slice(0, Number(S.training.people) || 1) },
    exam: { records: S.exam.records.map(r => ({ ...r })) }, self: { ...S.self }
  }[k];
  const slots = (k === "consult" || k === "service") ? [] : S.slots[S.sub.self].slice().sort(slotCmp);
  const p = curPrice();
  return { mode: S.mode, kind: k, applicant: { ...S.applicant }, slots, hours: p.qty, unit: p.unit, rate: p.rate, cost: p.cost, priceNote: p.note, details,
    ...(S.submitted ? { id: S.submitted.id, createdAt: S.submitted.createdAt, status: S.submitted.status } : {}) };
}

/* ----- 表單讀取 / 驗證 ----- */
const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : undefined; };
function collect() {
  if (S.step === 1) { const a = S.applicant; ["rateGroup", "name", "sid", "dept", "advisor", "email", "phone", "account", "note"].forEach(k => { const x = v("a_" + k); if (x !== undefined) a[k] = x; }); }
  if (S.step === 3) {
    if (v("c_topic") !== undefined) { S.consult.topic = v("c_topic"); S.consult.detail = v("c_detail"); S.consult.prefer = v("c_prefer"); }
    if (v("o_ref") !== undefined) ["ref", "count", "type", "size", "solvent", "repeat", "hours", "date", "note"].forEach(k => S.order[k] = v("o_" + k));
    if (v("t_round") !== undefined) S.training.round = v("t_round");
    if (v("t_people") !== undefined) {
      const n = Number(S.training.people) || 1;
      S.training.trainees = Array.from({ length: Math.max(n, S.training.trainees.length) }, (_, i) => v("t_name" + i) !== undefined ? v("t_name" + i) : (S.training.trainees[i] || ""));
      S.training.people = v("t_people");
    }
    if (v("r0_trainee") !== undefined) S.exam.records = [0, 1, 2].map(i => ({ trainee: v(`r${i}_trainee`), trainer: v(`r${i}_trainer`), date: v(`r${i}_date`), hours: v(`r${i}_hours`) }));
    if (v("u_purpose") !== undefined) { S.self.purpose = v("u_purpose"); S.self.samples = v("u_samples"); }
  }
}

  if (S.step === 3) {
    const k = currentKind();

function contiguous(keys) {
  const days = new Set(keys.map(k => k.split("|")[0])); if (days.size > 1) return false;
  const idx = keys.map(k => CONFIG.hours.indexOf(+k.split("|")[1])).sort((a, b) => a - b);
  return idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab],[data-slot],#rail li"); if (!t || t.disabled) return;
  if (t.matches("#rail li")) { const n = +t.dataset.s; if (n < S.step && !S.submitted) { collect(); S.step = n; render(); } return; }
  if (t.dataset.tab) { collect(); const [g, k] = t.dataset.tab.split(":"); S.sub[g] = k; render(); return; }
  if (t.dataset.slot) {
    collect();
    const kind = S.sub.self, key = t.dataset.slot, arr = S.slots[kind], max = kind === "use" ? CONFIG.maxSelfHours : 1, i = arr.indexOf(key);
    if (i >= 0) { arr.splice(i, 1); if (arr.length && !contiguous(arr)) arr.length = 0; }
    else {
      if (max === 1) arr.length = 0;
      else if (arr.length >= max) { showErr(`單次最多預約 ${max} 小時`); return; }
      else if (arr.length && !contiguous([...arr, key])) { showErr("同一筆預約請選同一天的連續時段"); return; }
      arr.push(key);
    }
    render(); return;
  }
  const a = t.dataset.act; collect();
  if (a === "next") { if (!validate()) return; S.step++; S.submitError = ""; if (S.step === 3) loadSlots(); render(); window.scrollTo({ top: 0 }); }
  if (a === "prev") { S.step--; S.submitError = ""; render(); }

  if (a === "start") { S.step = 1; render(); window.scrollTo({ top: 0 }); return; }
  if (a === "wprev") { S.weekOffset--; render(); }
  if (a === "wnext") { S.weekOffset++; render(); }
  if (a === "submit") submit();
  if (a === "pdf") pdf();
  if (a === "fillExample") fillExample();
  if (a === "restart") { S.step = 2; S.slots = { training: [], exam: [], use: [] }; S.submitted = null; S.submitError = ""; loadSlots(); render(); window.scrollTo({ top: 0 }); }
});

  C.loading = false; render();
}
function select(id, rerender = true) { C.id = id; C.booking = (C.list || []).find(b => b.id === id) || null; C.end = ""; C.confirm = false; C.msg = ""; if (rerender) render(); }
async function checkout() {
  C.busy = true; C.err = ""; render();
  try {
    const r = await Api.call("checkout", { id: C.id, email: C.email, end: C.end });
    C.booking = r.booking; C.list = C.list.map(b => b.id === r.booking.id ? r.booking : b);
    C.msg = "簽退完成，繳費通知已寄到你的 Email。";
  } catch (e) { C.err = e.message; }
  C.busy = false; C.confirm = false; render();
}

function listHtml() {
  if (!C.list || !C.list.length) return "";
  return `<h3 style="font-size:.95rem;margin:20px 0 8px">你的預約（${C.list.length} 筆）${C.list.some(canCheckout) ? "　·　請點選要簽退的那一筆" : ""}</h3>
  <div class="blist">${C.list.map(b => {
    const on = b.id === C.id, first = (b.slots || []).slice().sort(slotCmp)[0];
    return `<button class="pickrow${on ? " on" : ""}" data-pick="${esc(b.id)}">
      <span class="pill ${b.status}">${STATUS_LABEL[b.status] || b.status}</span>
      <span>${esc(RATE_LABEL[b.kind] || b.kind)}</span>
      <span class="mono">${first ? esc(fmtSlot(first)) + (b.slots.length > 1 ? `（共 ${b.slots.length} 小時）` : "") : "—"}</span>
      <span class="mono muted">${esc(b.id)}</span>
      ${canCheckout(b) ? `<span class="tagok">可簽退</span>` : ""}</button>`;
  }).join("")}</div>`;
}
function render() {
  const b = C.booking;
  $("#stage").innerHTML = `<h2>查詢預約</h2><p class="hint">請輸入預約時填寫的 Email，系統會列出你的預約。</p>
  <form id="lookupForm" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
    <label class="f" style="flex:1;min-width:220px"><span class="req">Email</span><input id="c_email" type="email" value="${esc(C.email)}" autocomplete="email"></label>
    <button class="b primary" type="submit"${C.loading ? " disabled" : ""}>${C.loading ? "查詢中…" : "查詢"}</button>
  </form>
  ${C.err ? `<p class="err">${esc(C.err)}</p>` : ""}
  ${listHtml()}
  ${b ? detail(b) : ""}`;
}
function detail(b) {
  const a = b.applicant || {}, st = bookingStart(b);
  const rows = [["申請人", `${a.name}（${a.dept}）`], ["服務類型", RATE_LABEL[b.kind] || b.kind], ["收費身分", billingLabel(a)]];
  if ((b.slots || []).length) rows.push(["預約時段", b.slots.slice().sort(slotCmp).map(fmtSlot).join("、")]);
  let body = "";
  if (b.status === "completed") {
    const r2 = [["計費起始", b.billStart ? fmtDateTime(b.billStart) : "—"], [b.kind === "self" ? "使用結束時間" : "結算日期", fmtDateTime(b.checkoutAt)]];
    if (b.unit !== "套") r2.push(["計費時間", fmtDuration(b.billMinutes)], ["單價", money(b.billRate) + " / hr"]);
    body = `${C.msg ? `<div class="notice ok">${esc(C.msg)}</div>` : ""}
      <dl class="kv">${r2.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}<dt>應繳金額</dt><dd class="bill-big">${money(b.billAmount)}</dd></dl>
      <div class="btns"><span></span><button class="b primary" data-act="bill"${C.pdfBusy ? " disabled" : ""}>${C.pdfBusy ? "產生中…" : "下載繳費單 PDF"}</button></div>`;
  } else if (b.status === "pending") body = `<p class="hint">這筆預約還在等管理人員核准，核准後才能簽退。</p>`;
  else if (b.status === "rejected" || b.status === "cancelled") body = `<p class="err">這筆預約${STATUS_LABEL[b.status]}${b.adminNote ? "：" + esc(b.adminNote) : ""}。</p>`;
  else if (b.kind !== "self") body = `<p class="hint">「${esc(RATE_LABEL[b.kind])}」由管理人員結算，不需要自行簽退。結算完成後會寄繳費通知到你的 Email。</p>`;
  else if (C.now < st) body = `<p class="hint">預約時段在 ${fmtDateTime(st.toISOString())} 開始，開始之後才能簽退。</p>`;
  else if (C.now - st > CONFIG.selfCheckoutDays * 86400e3) body = `<p class="hint">這筆預約開始已超過 ${CONFIG.selfCheckoutDays} 天，無法自行簽退。請聯絡機台管理人員，由管理人員登錄實際結束時間並結算。</p>`;
  else {
    const opts = endOptions(b, new Date());
    if (!opts.some(o => o.toISOString() === C.end)) {
      // 預設帶入「預約結束時間」；若還沒到，就用最接近現在的時間
      const bookedEnd = new Date(st.getTime() + (b.slots || []).length * 3600e3).toISOString();
      C.end = opts.some(o => o.toISOString() === bookedEnd) ? bookedEnd : (opts.length ? opts[opts.length - 1].toISOString() : "");
    }
    let est; try { est = settle(b, { end: C.end }); } catch (e) { est = null; }
    const wd = ["日", "一", "二", "三", "四", "五", "六"];
    const lab = d => `${d.getMonth() + 1}/${d.getDate()}（${wd[d.getDay()]}）${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    body = `<dl class="kv"><dt>計費起始</dt><dd>${fmtDateTime(st.toISOString())}（預約開始時間）</dd></dl>
      <label class="f" style="max-width:320px;margin-top:12px"><span class="req">實際使用結束時間</span>
        <select id="endSel"${C.confirm ? " disabled" : ""}>${opts.slice().reverse().map(o => `<option value="${o.toISOString()}"${o.toISOString() === C.end ? " selected" : ""}>${lab(o)}</option>`).join("")}</select></label>
      ${est ? `<dl class="kv" style="margin-top:10px"><dt>計費時間</dt><dd>${fmtDuration(est.billMinutes)}（${est.billMinutes / CONFIG.billUnitMinutes} 單位 × ${CONFIG.billUnitMinutes} 分鐘）</dd><dt>應繳金額</dt><dd class="bill-big">${money(est.billAmount)}</dd></dl>` : ""}
      <p class="hint" style="margin-top:10px">請選擇你實際結束使用的時間，每 ${CONFIG.billUnitMinutes} 分鐘一格，費用從預約開始時間算起。系統會同時記錄你按下簽退的時間，送出後無法修改。</p>
      <div class="btns"><span></span><div class="right">
        ${C.confirm ? `<button class="b ghost" data-act="unconfirm">取消</button><button class="b ok" data-act="checkout"${C.busy ? " disabled" : ""}>${C.busy ? "簽退中…" : "確定簽退"}</button>`
          : `<button class="b primary" data-act="ask">簽退</button>`}</div></div>`;
  }
  return `<article class="bitem ${b.status}" style="margin-top:18px">
    <div class="bhead"><span class="pill ${b.status}">${STATUS_LABEL[b.status] || b.status}</span><span class="who mono">${esc(b.id)}</span></div>
    <dl class="kv" style="margin:10px 0 12px">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${body}</article>`;
}

document.addEventListener("submit", e => {
  if (e.target.id !== "lookupForm") return;
  e.preventDefault(); C.email = $("#c_email").value.trim(); C.msg = "";
  if (!C.email) { C.err = "請輸入 Email"; render(); return; }
  lookup();
});
document.addEventListener("change", e => { if (e.target.id === "endSel") { C.end = e.target.value; render(); } });
document.addEventListener("click", async e => {
  const p = e.target.closest("[data-pick]"); if (p) { select(p.dataset.pick); return; }
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act;
  if (a === "ask") { C.confirm = true; render(); }
  if (a === "unconfirm") { C.confirm = false; render(); }
  if (a === "checkout") checkout();
  if (a === "bill") { C.pdfBusy = true; render(); try { await downloadPdf(C.booking, "bill"); } catch (err) { C.err = "PDF 產生失敗：" + err.message; } C.pdfBusy = false; render(); }
});
setInterval(() => { const b = C.booking; if (b && b.status === "approved" && b.kind === "self" && !C.confirm && !C.busy && document.activeElement?.id !== "endSel") { C.now = new Date(); render(); } }, 60000);

$("#demoBanner").hidden = !DEMO;
$("#unitName").textContent = CONFIG.unit;
render();
if (C.email) lookup();

}
(function route() {
  const views = { "#admin": ["tplAdmin", initAdmin, "NTA 預約管理"], "#checkout": ["tplCheckout", initCheckout, "NTA 使用簽退"] };
  const docAdd = document.addEventListener.bind(document), docRemove = document.removeEventListener.bind(document);
  const setInt = window.setInterval.bind(window);
  let current = null, cleanup = [];
  // 切換頁面時不重新載入：清掉上一頁註冊的事件與計時器，再掛上新頁
  function mount(hash) {
    const key = views[hash] ? hash : "";
    if (key === current) return;
    current = key;
    cleanup.forEach(f => f()); cleanup = [];
    const [tpl, init, title] = views[key] || ["tplUser", initUser, "NTA 機台預約系統"];
    document.title = title;
    const app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(document.getElementById(tpl).content.cloneNode(true));
    document.addEventListener = (t, f, o) => { docAdd(t, f, o); cleanup.push(() => docRemove(t, f, o)); };
    window.setInterval = (f, ms) => { const id = setInt(f, ms); cleanup.push(() => clearInterval(id)); return id; };
    try { init(); } finally { document.addEventListener = docAdd; window.setInterval = setInt; }
    window.scrollTo(0, 0);
  }
  docAdd("click", e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    const h = a.getAttribute("href");
    try { history.pushState(null, "", h === "#" ? location.pathname + location.search : h); } catch (_) { }
    mount(h);
  }, true);
  window.addEventListener("hashchange", () => mount(location.hash));
  window.addEventListener("popstate", () => mount(location.hash));
  mount(location.hash);
})();
</script>
</body>
