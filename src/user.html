<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTA 機台預約系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/common.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="tag">Nanoparticle Tracking Analysis</div>
      <h1>NTA 機台預約系統</h1>
      <p class="sub">四步驟完成申請，送出後可下載申請單（申請人聯、管理人聯、切結書各一頁）</p>
    </div>
  </header>

  <div class="demo-banner" id="demoBanner" hidden>
    <span><b>示範模式</b>：尚未設定資料庫網址（CONFIG.apiUrl），預約只會存在你這台電腦的瀏覽器，其他人看不到。</span>
    <button class="b ghost sm" data-act="fillExample">填入範例資料</button>
  </div>

  <ol class="rail" id="rail">
    <li data-s="1"><span class="n">STEP 1</span><span class="t">申請人資料</span></li>
    <li data-s="2"><span class="n">STEP 2</span><span class="t">服務類型</span></li>
    <li data-s="3"><span class="n">STEP 3</span><span class="t">預約內容</span></li>
    <li data-s="4"><span class="n">STEP 4</span><span class="t">確認送出</span></li>
  </ol>

  <main class="card" id="stage"></main>

  <footer class="foot"><span id="unitName"></span><a href="admin.html">管理人員登入</a></footer>
</div>

<script>
const blankApplicant = () => ({ rateGroup: "", name: "", sid: "", dept: CONFIG.departments[0], advisor: "", email: "", phone: "", account: "", note: "" });
const S = {
  step: 1,
  applicant: blankApplicant(),
  mode: "self",
  sub: { service: "consult", self: "use" },
  consult: { topic: "", detail: "", prefer: "" },
  order: { ref: "", count: "", type: "", size: "", solvent: "", repeat: 3, hours: "", date: "", note: "" },
  training: { round: "1" },
  exam: { records: [0, 1, 2].map(() => ({ trainee: "", trainer: "", date: "", hours: "1" })) },
  self: { purpose: "", samples: "" },
  slots: { training: [], exam: [], use: [] },
  weekOffset: 1,              // 從下週開始開放預約
  slotMap: {}, slotsLoaded: false, slotsError: "",
  submitted: null, submitting: false, submitError: "", pdfBusy: false
};

/* ----- 時段資料 ----- */
async function loadSlots() {
  try { const r = await Api.call("slots"); S.slotMap = r.slots || {}; S.slotsError = ""; }
  catch (e) { S.slotsError = "無法載入已預約時段：" + e.message; }
  S.slotsLoaded = true;
  // 已選但剛被別人預約的時段要移除
  for (const k of Object.keys(S.slots)) S.slots[k] = S.slots[k].filter(s => !S.slotMap[s]);
  if (S.step === 3) render();
}

/* ----- 計價 ----- */
function currentKind() {
  if (S.mode === "service") return S.sub.service === "consult" ? "consult" : "service";
  return { training: "training", exam: "exam", use: "self" }[S.sub.self];
}
function curPrice() {
  return priceFor(currentKind(), S.applicant.rateGroup, { hours: billHours(), round: S.training.round });
}
function billHours() {
  const k = currentKind();
  if (k === "consult") return 0;
  if (k === "service") return Number(S.order.hours) || 0;
  return S.slots[S.sub.self].length;
}
function priceBar() {
  const p = curPrice();
  return `<div class="pricebar"><span>收費身分：<b>${esc(groupLabel(S.applicant.rateGroup))}</b></span>
    <span>計價方式：<b class="mono">${money(p.rate)} / ${p.unit}</b>（${esc(p.note)}）</span>
    <span>計費數量：<b class="mono">${p.qty} ${p.unit}</b></span><span>預估費用：<span class="big">${money(p.cost)}</span></span></div>`;
}
function buildBooking() {
  const k = currentKind(), details = {
    consult: { ...S.consult }, service: { ...S.order }, training: { ...S.training },
    exam: { records: S.exam.records.map(r => ({ ...r })) }, self: { ...S.self }
  }[k];
  const slots = (k === "consult" || k === "service") ? [] : S.slots[S.sub.self].slice().sort();
  const p = curPrice();
  return { mode: S.mode, kind: k, applicant: { ...S.applicant }, slots, hours: p.qty, unit: p.unit, rate: p.rate, cost: p.cost, priceNote: p.note, details,
    ...(S.submitted ? { id: S.submitted.id, createdAt: S.submitted.createdAt, status: S.submitted.status } : {}) };
}

/* ----- 畫面 ----- */
function render() {
  document.querySelectorAll("#rail li").forEach(li => { const n = +li.dataset.s; li.className = n < S.step ? "done" : n === S.step ? "cur" : ""; });
  $("#stage").innerHTML = [null, step1, step2, step3, step4][S.step]();
  if (S.step === 4) mountPreview($("#preview"), buildBooking());
  bind();
}
function field(id, label, val, { type = "text", req = false, full = false, ph = "" } = {}) {
  return `<label class="f${full ? " full" : ""}"><span class="${req ? "req" : ""}">${label}</span><input id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}"></label>`;
}
function step1() {
  const a = S.applicant;
  return `<h2>申請人資料</h2><p class="hint">標 * 為必填。經費來源用於後續請款。</p>
  <div class="grid">
    <label class="f full"><span class="req">收費身分（管理人員會核對）</span><select id="a_rateGroup"><option value="">請選擇</option>${CONFIG.rateGroups.map(g => `<option value="${g.id}"${g.id === a.rateGroup ? " selected" : ""}>${esc(g.label)}</option>`).join("")}</select></label>
    <details class="full"${a.rateGroup ? "" : " open"}><summary style="cursor:pointer;color:var(--muted);font-size:.85rem">收費標準</summary>${priceTableHtml(a.rateGroup)}
      <p class="hint" style="margin:6px 0 0">訓練課程按「套」收費，含 3 次訓練與考核，於預約第 1 次訓練時計費。諮詢不收費。</p></details>
    ${field("a_name", "申請人姓名", a.name, { req: true })}
    ${field("a_sid", "學號 / 員工編號", a.sid, { req: true })}
    <label class="f"><span class="req">所屬系所</span><select id="a_dept">${CONFIG.departments.map(d => `<option${d === a.dept ? " selected" : ""}>${esc(d)}</option>`).join("")}</select></label>
    ${field("a_advisor", "指導教授", a.advisor, { req: true })}
    ${field("a_email", "Email", a.email, { type: "email", req: true })}
    ${field("a_phone", "聯絡電話", a.phone, { type: "tel" })}
    ${field("a_account", "計畫編號 / 經費來源", a.account, { full: true, ph: "例：NSTC 114-XXXX-E-007-XXX" })}
    <label class="f full"><span>備註</span><textarea id="a_note" style="min-height:70px">${esc(a.note)}</textarea></label>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="btns"><span></span><button class="b primary" data-act="next">下一步：服務類型</button></div>`;
}
function step2() {
  return `<h2>服務類型</h2><p class="hint">尚未通過機台考核者，請選擇「委託代工」或先預約機台訓練。</p>
  <div class="opts">
    <label class="opt"><input type="radio" name="mode" value="service"${S.mode === "service" ? " checked" : ""}><b>委託代工</b><small>由機台管理人員代為量測。需先預約諮詢，確認實驗方案後再下單。</small></label>
    <label class="opt"><input type="radio" name="mode" value="self"${S.mode === "self" ? " checked" : ""}><b>自行操作</b><small>需完成 3 次機台訓練並通過考核後，方可預約使用時段。</small></label>
  </div>
  <div class="btns"><button class="b" data-act="prev">上一步</button><button class="b primary" data-act="next">下一步：預約內容</button></div>`;
}
function tabs(group, items) {
  return `<div class="tabs" role="tablist">${items.map(([k, l]) => `<button role="tab" data-tab="${group}:${k}" aria-selected="${S.sub[group] === k}">${l}</button>`).join("")}</div>`;
}
function slotPicker(kind, max, label) {
  if (!S.slotsLoaded) return `<p class="empty">正在載入可預約時段…</p>`;
  const sel = S.slots[kind];
  return `${S.slotsError ? `<p class="err">${esc(S.slotsError)}</p>` : ""}
  ${calendarHtml({ offset: S.weekOffset, minOffset: 1, maxOffset: CONFIG.weeksAhead, map: S.slotMap, selected: sel })}
  <p class="hint" style="margin:6px 0 0">${label}，最多選 ${max} 格。</p>
  ${sel.length ? `<p class="mono" style="font-size:.82rem;margin:6px 0 0">已選：${sel.slice().sort().map(fmtSlot).join("、")}</p>` : ""}`;
}
function step3() {
  let body = "";
  if (S.mode === "service") {
    body = tabs("service", [["consult", "① 預約諮詢"], ["order", "② 已完成諮詢・下單"]]);
    if (S.sub.service === "consult") {
      const c = S.consult;
      body += `<p class="hint">請先與機台管理人員討論實驗方案、樣品件數與可行性。管理人員會以 Email 回覆諮詢時間。</p>
      <div class="grid">
        ${field("c_topic", "諮詢主題", c.topic, { req: true, full: true })}
        <label class="f full"><span class="req">實驗方案說明（樣品來源、種類、件數、溶劑、預期粒徑範圍、想解決的問題）</span><textarea id="c_detail" style="min-height:170px">${esc(c.detail)}</textarea></label>
        ${field("c_prefer", "方便諮詢的時間", c.prefer, { full: true, ph: "例：週二、週四下午" })}
      </div>`;
    } else {
      const o = S.order;
      body += `<p class="hint">僅限已完成預約諮詢之申請人。請填寫與管理人員確認過的實驗內容。</p>
      <div class="grid">
        ${field("o_ref", "諮詢單號 / 諮詢日期", o.ref, { req: true, ph: "例：NTA-20261015-001" })}
        ${field("o_count", "樣品件數", o.count, { type: "number", req: true })}
        ${field("o_type", "樣品種類", o.type, { req: true, ph: "例：外泌體、脂質奈米粒、奈米金" })}
        ${field("o_size", "預期粒徑範圍 (nm)", o.size, { ph: "例：50–200" })}
        ${field("o_solvent", "分散液 / 緩衝液", o.solvent, { ph: "例：PBS、去離子水" })}
        ${field("o_repeat", "每件量測次數", o.repeat, { type: "number" })}
        ${field("o_hours", "預估機台時數 (hr)", o.hours, { type: "number", req: true })}
        ${field("o_date", "希望完成日期", o.date, { type: "date" })}
        <label class="f full"><span>實驗內容 / 特殊需求</span><textarea id="o_note" style="min-height:90px">${esc(o.note)}</textarea></label>
      </div>`;
    }
  } else {
    body = tabs("self", [["training", "機台訓練"], ["exam", "機台考核"], ["use", "預約使用"]]);
    if (S.sub.self === "training") {
      body += `<p class="hint">每次訓練 1 小時，共需完成 3 次訓練才能預約考核。</p>
      <div class="grid" style="margin-bottom:12px"><label class="f"><span class="req">本次為第幾次訓練</span><select id="t_round">${["1", "2", "3"].map(r => `<option value="${r}"${S.training.round === r ? " selected" : ""}>第 ${r} 次</option>`).join("")}</select></label></div>
      ${slotPicker("training", 1, "訓練 1 小時")}`;
    } else if (S.sub.self === "exam") {
      body += `<p class="hint">預約考核前請填寫 3 次訓練紀錄，管理人員會與訓練簽到表核對。</p>
      <div class="rec-scroll"><table class="rec"><tr><th>#</th><th>受訓人</th><th>訓練人</th><th>受訓日期</th><th>受訓時數</th></tr>
      ${S.exam.records.map((r, i) => `<tr><td class="mono">${i + 1}</td>
        <td><input type="text" id="r${i}_trainee" value="${esc(r.trainee || S.applicant.name)}"></td>
        <td><input type="text" id="r${i}_trainer" value="${esc(r.trainer)}" placeholder="管理人員姓名"></td>
        <td><input type="date" id="r${i}_date" value="${esc(r.date)}"></td>
        <td><input type="number" id="r${i}_hours" value="${esc(r.hours)}" min="0" step="0.5" style="max-width:80px"></td></tr>`).join("")}
      </table></div>
      <h3 style="font-size:.95rem;margin:20px 0 4px">選擇考核時段</h3>
      ${slotPicker("exam", 1, "考核 1 小時")}`;
    } else {
      body += `<p class="hint">限已通過考核者。可選連續或分開的時段。</p>
      <div class="grid" style="margin-bottom:12px">
        ${field("u_purpose", "量測目的 / 樣品", S.self.purpose, { req: true })}
        ${field("u_samples", "樣品件數", S.self.samples, { type: "number" })}
      </div>
      ${slotPicker("use", CONFIG.maxSelfHours, "自行操作")}`;
    }
  }
  return `<h2>預約內容 · ${S.mode === "service" ? "委託代工" : "自行操作"}</h2>${body}${priceBar()}
  <div class="err" id="err" hidden></div>
  <div class="btns"><button class="b" data-act="prev">上一步</button><button class="b primary" data-act="next">下一步：確認送出</button></div>`;
}
function step4() {
  const done = S.submitted;
  return `${done ? `<div class="notice ok"><b>已送出預約</b>　申請編號 <span class="mono">${esc(done.id)}</span>，狀態：待管理人員確認。<br>請下載申請單，簽名後將「管理人聯」與「切結書」交給機台管理人員。</div>`
      : `<h2>確認送出</h2><p class="hint">請確認申請單內容。送出後時段會先保留為「待確認」，管理人員核准後正式鎖定。</p>`}
  <div id="preview"></div>
  ${S.submitError ? `<p class="err">${esc(S.submitError)}</p>` : ""}
  <div class="btns">
    ${done ? `<button class="b" data-act="restart">新增另一筆預約</button>` : `<button class="b" data-act="prev">返回修改</button>`}
    <div class="right">
      ${done ? `<button class="b primary" data-act="pdf"${S.pdfBusy ? " disabled" : ""}>${S.pdfBusy ? "產生 PDF 中…" : "下載申請單 PDF"}</button>`
        : `<button class="b primary" data-act="submit"${S.submitting ? " disabled" : ""}>${S.submitting ? "送出中…" : "送出預約"}</button>`}
    </div>
  </div>`;
}

/* ----- 表單讀取 / 驗證 ----- */
const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : undefined; };
function collect() {
  if (S.step === 1) { const a = S.applicant; ["rateGroup", "name", "sid", "dept", "advisor", "email", "phone", "account", "note"].forEach(k => { const x = v("a_" + k); if (x !== undefined) a[k] = x; }); }
  if (S.step === 3) {
    if (v("c_topic") !== undefined) { S.consult.topic = v("c_topic"); S.consult.detail = v("c_detail"); S.consult.prefer = v("c_prefer"); }
    if (v("o_ref") !== undefined) ["ref", "count", "type", "size", "solvent", "repeat", "hours", "date", "note"].forEach(k => S.order[k] = v("o_" + k));
    if (v("t_round") !== undefined) S.training.round = v("t_round");
    if (v("r0_trainee") !== undefined) S.exam.records = [0, 1, 2].map(i => ({ trainee: v(`r${i}_trainee`), trainer: v(`r${i}_trainer`), date: v(`r${i}_date`), hours: v(`r${i}_hours`) }));
    if (v("u_purpose") !== undefined) { S.self.purpose = v("u_purpose"); S.self.samples = v("u_samples"); }
  }
}
function showErr(msg) { const e = $("#err"); if (e) { e.hidden = false; e.textContent = msg; } }
function validate() {
  const miss = [];
  const need = (id, label) => { const e = document.getElementById(id); if (e && !e.value.trim()) { e.classList.add("invalid"); miss.push(label); } };
  if (S.step === 1) {
    need("a_rateGroup", "收費身分"); need("a_name", "姓名"); need("a_sid", "學號"); need("a_advisor", "指導教授"); need("a_email", "Email");
    const em = $("#a_email"); if (em && em.value && !/^\S+@\S+\.\S+$/.test(em.value)) { em.classList.add("invalid"); miss.push("正確的 Email 格式"); }
  }
  if (S.step === 3) {
    const k = currentKind();
    if (k === "consult") { need("c_topic", "諮詢主題"); need("c_detail", "實驗方案說明"); }
    if (k === "service") { need("o_ref", "諮詢單號"); need("o_count", "樣品件數"); need("o_type", "樣品種類"); need("o_hours", "預估時數"); }
    if (k === "exam") [0, 1, 2].forEach(i => { need(`r${i}_trainer`, `第${i + 1}次訓練人`); need(`r${i}_date`, `第${i + 1}次受訓日期`); });
    if (k === "self") need("u_purpose", "量測目的");
    if (["training", "exam", "self"].includes(k) && !S.slots[S.sub.self].length) miss.push("預約時段");
  }
  if (miss.length) showErr("請補上：" + miss.join("、"));
  return !miss.length;
}

/* ----- 事件 ----- */
function bind() {
  $("#stage").querySelectorAll("input,select,textarea").forEach(el => el.addEventListener("input", () => {
    el.classList.remove("invalid");
    if (S.step === 3 && (el.id === "o_hours" || el.id === "t_round")) { collect(); const p = $(".pricebar"); if (p) p.outerHTML = priceBar(); }
  }));
  $("#stage").querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", () => { S.mode = r.value; }));
}
async function submit() {
  S.submitting = true; S.submitError = ""; render();
  try {
    const r = await Api.call("book", { booking: buildBooking() });
    S.submitted = { id: r.id, status: r.status || "pending", createdAt: r.createdAt || new Date().toISOString() };
  } catch (e) {
    const c = conflictSlots(e);
    if (c) {
      S.submitError = "你選的時段剛好被別人預約了：" + c.map(fmtSlot).join("、") + "。請回上一步重新選擇。";
      await loadSlots();
    } else S.submitError = "送出失敗：" + e.message;
  }
  S.submitting = false; render();
}
async function pdf() {
  S.pdfBusy = true; render();
  try { await downloadPdf(buildBooking()); }
  catch (e) { S.submitError = "PDF 產生失敗：" + e.message; }
  S.pdfBusy = false; render();
}
function fillExample() {
  Object.assign(S.applicant, { rateGroup: "coe", name: "王小明", sid: "112033501", dept: "奈米工程與微系統研究所", advisor: "陳大文 教授", email: "xiaoming@example.com", phone: "0912-345-678", account: "NSTC 114-2221-E-007-000" });
  S.consult = { topic: "外泌體 (exosome) 粒徑分佈與濃度量測", detail: "樣品為細胞培養上清液經超高速離心純化之外泌體，預計 6 件，溶於 PBS。想確認是否需要先稀釋、建議的濃度範圍，以及每件建議量測幾次。", prefer: "週二、週四下午" };
  S.self = { purpose: "奈米金粒子粒徑分佈量測", samples: "4" };
  render();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab],[data-slot],#rail li"); if (!t || t.disabled) return;
  if (t.matches("#rail li")) { const n = +t.dataset.s; if (n < S.step && !S.submitted) { collect(); S.step = n; render(); } return; }
  if (t.dataset.tab) { collect(); const [g, k] = t.dataset.tab.split(":"); S.sub[g] = k; render(); return; }
  if (t.dataset.slot) {
    collect();
    const kind = S.sub.self, key = t.dataset.slot, arr = S.slots[kind], max = kind === "use" ? CONFIG.maxSelfHours : 1, i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1);
    else { if (max === 1) arr.length = 0; else if (arr.length >= max) { showErr(`單次最多預約 ${max} 小時`); return; } arr.push(key); }
    render(); return;
  }
  const a = t.dataset.act; collect();
  if (a === "next") { if (!validate()) return; S.step++; S.submitError = ""; if (S.step === 3) loadSlots(); render(); window.scrollTo({ top: 0 }); }
  if (a === "prev") { S.step--; S.submitError = ""; render(); }
  if (a === "wprev") { S.weekOffset--; render(); }
  if (a === "wnext") { S.weekOffset++; render(); }
  if (a === "submit") submit();
  if (a === "pdf") pdf();
  if (a === "fillExample") fillExample();
  if (a === "restart") { S.step = 2; S.slots = { training: [], exam: [], use: [] }; S.submitted = null; S.submitError = ""; loadSlots(); render(); window.scrollTo({ top: 0 }); }
});

$("#demoBanner").hidden = !DEMO;
$("#unitName").textContent = CONFIG.unit;
render();
loadSlots();
</script>
